grund_config_version = 1
project_name = "root"
project_description = "Repository for shared GraalVM reachability metadata, tests, and release infrastructure"

[workspace]
members = ["forge"]
include_root = true

[reference]
marker = "§"
trigger = "$$"
strict = true
require_grounding = false
inline_style = "citation-with-note" # citation-with-note | citation-only
inline_note_suggested_lines = 1
inline_note_max_lines = 3
inline_note_max_columns = 100
warn_on_suggested = false

[id]
format = "{kind}-{slug}" # placeholders: {kind} required; use {number}, {slug}, or both
section_separator = "."
section_heading_levels = "strict" # strict | warn | loose
number_pattern = "\\d+"
slug_pattern = "[a-z0-9][a-z0-9-]*"

[[kinds]]
prefix = "GRUND"
file = "docs/grund.md"
title = "Why: repository motivation"

[[kinds]]
prefix = "GOAL"
file = "docs/goals.md"
title = "Where: repository direction and outcomes"

[[kinds]]
prefix = "PRCPL"
file = "docs/principles.md"
title = "Cross-cutting principles for how the repository works"

[[kinds]]
prefix = "FS"
folder = "docs/functional-spec"
title = "Repository functional behavior and contributor-facing requirements"

[[kinds]]
prefix = "AR"
folder = "docs/architecture"
title = "Repository architecture and build infrastructure"

[[kinds]]
prefix = "TCK"
file = "docs/tck.md"
title = "Test harness (TCK): task groups"

[[kinds]]
prefix = "E2E"
file = "docs/e2e.md"
title = "Infrastructure end-to-end tests (testInfra/testAllInfra)"

[[kinds]]
prefix = "CI"
file = "docs/ci.md"
title = "Recurring CI workflows and composite actions"

[[kinds]]
prefix = "METADATA"
file = "docs/metadata.md"
title = "The metadata/ suite: shipped reachability metadata"

[[kinds]]
prefix = "TESTS"
file = "docs/tests.md"
title = "The tests/ suite: tests that justify the metadata"

[[kinds]]
prefix = "SKILL"
folder = "skills"
title = "Agent review and automation skills"

[scan]
include = ["AGENTS.md", "README.md", "COVERAGE.md", "docs", "skills", ".github/workflows", ".github/actions", "build.gradle"]
exclude = ["target", "node_modules", ".git", "dist", "build", ".venv", ".gradle", "out", "metadata", "stats", "tests", "forge/.venv", "forge/**/__pycache__"]
extensions = ["md", "html", "yml", "yaml", "gradle"]
comment_prefixes = ["//", "#", "/*", "*", "<!--"]
docstring_python = false
respect_gitignore = true

[output]
format = "text" # text | json
color = "auto" # auto | always | never
relative_paths = true

[fmt.cross_refs]
enabled = false
anchor_format = "github" # github | gitlab | mkdocs | pandoc | none

[citations]
default = "may"

[citations.GOAL]
must = ["GRUND"]

[citations.PRCPL]
must = ["GOAL"]

[citations.FS]
should = ["GOAL|FS"]

[citations.AR]
must = ["FS|GOAL"]

[citations.TCK]
must = ["FS|AR|GOAL"]

[citations.E2E]
must = ["FS|TCK|AR"]

[citations.CI]
should = ["FS|TCK|METADATA|TESTS|E2E|GOAL"]

[citations.METADATA]
must = ["FS|GOAL"]

[citations.TESTS]
must = ["FS|METADATA|GOAL"]

[citations.SKILL]
must = ["FS|CI|METADATA|TESTS"]

[citations.code]
must = ["FS|AR|TCK|E2E|CI|METADATA|TESTS"]

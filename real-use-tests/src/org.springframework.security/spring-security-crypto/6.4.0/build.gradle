plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.springframework.security:spring-security-crypto:$libraryVersion"
    testImplementation "org.bouncycastle:bcprov-jdk18on:1.79"
    testImplementation "org.bouncycastle:bcpkix-jdk18on:1.79"
    testImplementation "org.springframework:spring-core:6.2.0"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

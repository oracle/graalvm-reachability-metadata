plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.hibernate.validator:hibernate-validator:$libraryVersion"
    testImplementation "org.glassfish:jakarta.el:4.0.2"
    testImplementation "org.javamoney.moneta:moneta-core:1.3"
    testImplementation "joda-time:joda-time:2.10.14"
    testImplementation "jakarta.persistence:jakarta.persistence-api:3.0.0"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:2.13.5"
}

graalvmNative {
    binaries {
        test {
            // GR-48702: Native Image's resource bundle lookup substitution is not correct,
            // so turn it off.
            buildArgs.add("-H:-LocalizationSubstituteLoadLookup")
            buildArgs.add("-H:IncludeLocales=de,fr,pt-BR,es")
            buildArgs.add("--enable-url-protocols=https")
        }
    }
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

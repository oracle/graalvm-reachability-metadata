plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "com.rabbitmq:amqp-client:$libraryVersion"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:2.12.2"
    testImplementation "io.micrometer:micrometer-core:1.6.5"
    testImplementation "io.dropwizard.metrics:metrics-core:4.1.18"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

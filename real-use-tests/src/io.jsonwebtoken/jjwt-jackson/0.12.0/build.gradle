plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "io.jsonwebtoken:jjwt-jackson:$libraryVersion"
    testImplementation "io.jsonwebtoken:jjwt-api:$libraryVersion"
    testImplementation "io.jsonwebtoken:jjwt-impl:$libraryVersion"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:2.12.7.1"
    testImplementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.12.7"
    testImplementation "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.12.7"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.hsqldb:hsqldb:$libraryVersion"

    // Application integrations used by the database scenarios: pooling, JSON mapping,
    // a SQL DSL, a lightweight SQL mapper, and a fluent JDBC API.
    testImplementation "com.zaxxer:HikariCP:6.0.0"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:2.15.2"
    testImplementation "org.jdbi:jdbi3-core:3.49.3"
    testImplementation "org.jooq:jooq:3.20.0"
    testImplementation "org.mybatis:mybatis:3.5.19"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

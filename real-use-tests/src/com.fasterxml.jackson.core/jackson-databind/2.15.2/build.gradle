plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "com.fasterxml.jackson.core:jackson-databind:$libraryVersion"
    testImplementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2"
    testImplementation "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.15.2"
    testImplementation "com.fasterxml.jackson.module:jackson-module-parameter-names:2.15.2"
    testImplementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.15.2"
    testImplementation "com.fasterxml.jackson.dataformat:jackson-dataformat-csv:2.15.2"
    testImplementation "com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.15.2"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

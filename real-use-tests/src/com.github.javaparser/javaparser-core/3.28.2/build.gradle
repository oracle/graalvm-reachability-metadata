plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "com.github.javaparser:javaparser-core:$libraryVersion"
    testImplementation "com.github.javaparser:javaparser-symbol-solver-core:$libraryVersion"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:2.18.3"
    testImplementation "info.picocli:picocli:4.7.7"
    testImplementation "org.slf4j:slf4j-simple:2.0.17"
    testImplementation "commons-io:commons-io:2.18.0"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

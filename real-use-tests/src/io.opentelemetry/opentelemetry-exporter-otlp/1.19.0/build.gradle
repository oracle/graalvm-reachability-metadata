plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "io.opentelemetry:opentelemetry-exporter-otlp:$libraryVersion"
    testImplementation "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure:$libraryVersion-alpha"
    testImplementation "io.opentelemetry:opentelemetry-semconv:$libraryVersion-alpha"
    testImplementation "io.opentelemetry.proto:opentelemetry-proto:0.19.0-alpha"
    testImplementation "com.google.protobuf:protobuf-java:3.21.7"
    testImplementation "io.grpc:grpc-netty-shaded:1.49.2"
    testImplementation "io.grpc:grpc-protobuf:1.49.2"
    testImplementation "io.grpc:grpc-stub:1.49.2"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.10.0"
    testImplementation "com.squareup.okhttp3:okhttp-tls:4.10.0"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

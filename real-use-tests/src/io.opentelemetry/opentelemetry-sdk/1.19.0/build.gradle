plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "io.opentelemetry:opentelemetry-sdk:$libraryVersion"
    testImplementation "io.opentelemetry:opentelemetry-sdk-testing:$libraryVersion"
    testImplementation "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure:$libraryVersion-alpha"
    testImplementation "io.opentelemetry:opentelemetry-sdk-extension-resources:$libraryVersion"
    testImplementation "io.opentelemetry:opentelemetry-extension-trace-propagators:$libraryVersion"
    testImplementation "io.opentelemetry:opentelemetry-semconv:$libraryVersion-alpha"
    testImplementation "io.opentelemetry:opentelemetry-exporter-logging:$libraryVersion"
    testImplementation "io.opentelemetry:opentelemetry-exporter-otlp:$libraryVersion"
    testImplementation "io.opentelemetry:opentelemetry-exporter-zipkin:$libraryVersion"
    testImplementation "io.opentelemetry:opentelemetry-exporter-prometheus:$libraryVersion-alpha"
    testImplementation "org.assertj:assertj-core:3.22.0"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

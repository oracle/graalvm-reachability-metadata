plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.thymeleaf:thymeleaf:$libraryVersion"
    testImplementation "org.thymeleaf:thymeleaf-spring6:3.1.5.RELEASE"
    testImplementation "org.springframework:spring-context:6.2.8"
    testImplementation "org.springframework:spring-webmvc:6.2.8"
    testImplementation "jakarta.servlet:jakarta.servlet-api:6.1.0"
    testImplementation "tools.jackson.core:jackson-databind:3.0.0"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

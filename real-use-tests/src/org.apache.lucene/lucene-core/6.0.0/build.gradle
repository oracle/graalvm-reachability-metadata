plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.apache.lucene:lucene-core:$libraryVersion"

    // Application text analysis and user-query parsing for indexing and search workflows.
    testImplementation "org.apache.lucene:lucene-analyzers-common:6.0.0"
    testImplementation "org.apache.lucene:lucene-queryparser:6.0.0"
    // Application result presentation, autocomplete, and faceted navigation.
    testImplementation "org.apache.lucene:lucene-highlighter:6.0.0"
    testImplementation "org.apache.lucene:lucene-suggest:6.0.0"
    testImplementation "org.apache.lucene:lucene-facet:6.0.0"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

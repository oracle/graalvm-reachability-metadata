plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.jboss.resteasy:resteasy-client:$libraryVersion"
    testImplementation "org.jboss.resteasy:resteasy-jackson2-provider:6.2.12.Final"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:2.18.3"
    testImplementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.3"
    testImplementation "org.jboss.resteasy:resteasy-multipart-provider:6.2.12.Final"
    testImplementation "org.jboss.resteasy:resteasy-jaxb-provider:6.2.12.Final"
    testImplementation "org.glassfish.jaxb:jaxb-runtime:4.0.5"
    testImplementation "org.apache.httpcomponents:httpclient:4.5.14"
    testImplementation "org.apache.httpcomponents:httpasyncclient:4.1.5"
    testImplementation "org.assertj:assertj-core:3.22.0"
}

graalvmNative {
    binaries {
        test {
            buildArgs.add("--enable-url-protocols=http")
        }
    }
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

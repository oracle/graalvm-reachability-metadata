plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.apache.kafka:kafka-streams:$libraryVersion"
    testImplementation "org.apache.kafka:kafka-clients:3.6.0"
    testImplementation "org.apache.kafka:kafka-streams-test-utils:3.6.0"
    testImplementation "org.rocksdb:rocksdbjni:7.9.2"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:2.13.5"
    testImplementation "ch.qos.logback:logback-classic:1.4.5"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

plugins {
    id "org.graalvm.internal.tck"
    alias(libs.plugins.kotlin.jvm)
}

String libraryVersion = tck.testedLibraryVersion.get()
int testJvmVersion = tck.testJvmVersion.get()

dependencies {
    testImplementation "com.squareup.moshi:moshi-kotlin:$libraryVersion"
    testImplementation "com.squareup.moshi:moshi-adapters:$libraryVersion"
    testImplementation "com.squareup.retrofit2:retrofit:3.0.0"
    testImplementation "com.squareup.retrofit2:converter-moshi:3.0.0"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2"
    testImplementation "com.h2database:h2:2.3.232"
}

kotlin {
    jvmToolchain(testJvmVersion)
}

compileTestKotlin {
    kotlinOptions.jvmTarget = testJvmVersion.toString()
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

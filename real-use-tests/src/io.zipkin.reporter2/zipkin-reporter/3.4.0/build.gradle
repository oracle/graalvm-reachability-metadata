plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "io.zipkin.reporter2:zipkin-reporter:$libraryVersion"
    testImplementation "io.zipkin.reporter2:zipkin-reporter-brave:$libraryVersion"
    testImplementation "io.zipkin.reporter2:zipkin-sender-urlconnection:$libraryVersion"
    testImplementation "io.zipkin.reporter2:zipkin-sender-okhttp3:$libraryVersion"
    testImplementation "io.zipkin.reporter2:zipkin-sender-amqp-client:$libraryVersion"
    testImplementation "io.zipkin.reporter2:zipkin-reporter-metrics-micrometer:$libraryVersion"
    testImplementation "io.zipkin.reporter2:zipkin-reporter-spring-beans:$libraryVersion"
    testImplementation "io.zipkin.zipkin2:zipkin:2.27.1"
    testImplementation "io.zipkin.brave:brave:6.0.3"
    testImplementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "com.rabbitmq:amqp-client:5.21.0"
    testImplementation "io.micrometer:micrometer-core:1.12.5"
    testImplementation "org.springframework:spring-context:5.3.34"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

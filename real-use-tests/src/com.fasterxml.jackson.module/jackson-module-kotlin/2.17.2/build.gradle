plugins {
    id "org.graalvm.internal.tck"
    alias(libs.plugins.kotlin.jvm)
}

String libraryVersion = tck.testedLibraryVersion.get()
int testJvmVersion = tck.testJvmVersion.get()

dependencies {
    testImplementation "com.fasterxml.jackson.module:jackson-module-kotlin:$libraryVersion"
    testImplementation 'com.fasterxml.jackson.core:jackson-core:2.17.2'
    testImplementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.17.2'
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.2'
}

kotlin {
    jvmToolchain(testJvmVersion)
}

compileTestKotlin {
    kotlinOptions.jvmTarget = testJvmVersion.toString()
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "com.zaxxer:HikariCP:$libraryVersion"
    testImplementation "com.h2database:h2:2.3.232"
    testImplementation "io.dropwizard.metrics:metrics-core:3.2.5"
    testImplementation "io.dropwizard.metrics:metrics-healthchecks:3.2.5"
    testImplementation "io.micrometer:micrometer-core:1.5.10"
    testImplementation "io.prometheus:simpleclient:0.9.0"
    testImplementation "org.slf4j:slf4j-simple:1.7.36"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

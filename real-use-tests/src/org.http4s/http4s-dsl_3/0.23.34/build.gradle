plugins {
    id "org.graalvm.internal.tck"
    id "scala"
}

String libraryVersion = tck.testedLibraryVersion.get()
int testJvmVersion = tck.testJvmVersion.get()
String scala3Version = tck.scala3Version.get()

dependencies {
    testImplementation "org.http4s:http4s-dsl_3:$libraryVersion"
    testImplementation "org.http4s:http4s-server_3:$libraryVersion"
    testImplementation "org.http4s:http4s-client_3:$libraryVersion"
    testImplementation "org.http4s:http4s-ember-server_3:$libraryVersion"
    testImplementation "org.http4s:http4s-ember-client_3:$libraryVersion"
    testImplementation "org.http4s:http4s-circe_3:$libraryVersion"
    testImplementation "io.circe:circe-generic_3:0.14.15"
    testImplementation "io.circe:circe-parser_3:0.14.15"
    testImplementation "org.typelevel:cats-effect_3:3.7.0"
    testImplementation "org.scala-lang:scala3-library_3:$scala3Version"
    testImplementation "org.scala-lang:scala3-compiler_3:$scala3Version"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(testJvmVersion)
    }
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

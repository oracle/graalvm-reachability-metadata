plugins {
    id "org.graalvm.internal.tck"
    id "scala"
}

String libraryVersion = tck.testedLibraryVersion.get()
int testJvmVersion = tck.testJvmVersion.get()
String scala3Version = tck.scala3Version.get()

dependencies {
    testImplementation "org.playframework:play-server_3:$libraryVersion"

    // Concrete HTTP transport and application APIs for end-to-end server scenarios.
    testImplementation 'org.playframework:play-pekko-http-server_3:3.0.0'
    testImplementation 'org.playframework:play_3:3.0.0'
    testImplementation 'org.playframework:play-configuration_3:3.0.0'
    testImplementation 'org.playframework:play-streams_3:3.0.0'
    testImplementation 'org.playframework:play-json_3:3.0.0'
    testImplementation 'org.apache.pekko:pekko-actor_3:1.0.1'
    testImplementation 'org.apache.pekko:pekko-stream_3:1.0.1'
    testImplementation 'com.typesafe:config:1.4.3'

    testImplementation "org.scala-lang:scala3-library_3:$scala3Version"
    testImplementation "org.scala-lang:scala3-compiler_3:$scala3Version"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(testJvmVersion)
    }
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

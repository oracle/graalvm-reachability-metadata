plugins {
    id "org.graalvm.internal.tck"
    alias(libs.plugins.kotlin.jvm)
    id "org.jetbrains.kotlin.plugin.serialization" version "2.3.20"
}

String libraryVersion = tck.testedLibraryVersion.get()
int testJvmVersion = tck.testJvmVersion.get()

dependencies {
    testImplementation "com.github.ajalt.colormath:colormath-jvm:$libraryVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.9.0"
    testImplementation "io.ktor:ktor-client-cio-jvm:3.2.0"
    testImplementation "io.ktor:ktor-client-content-negotiation-jvm:3.2.0"
    testImplementation "io.ktor:ktor-serialization-kotlinx-json-jvm:3.2.0"
    testImplementation "com.fasterxml.jackson.module:jackson-module-kotlin:2.17.2"
    testImplementation "com.squareup.moshi:moshi-kotlin:1.15.2"
}

kotlin {
    jvmToolchain(testJvmVersion)
}

compileTestKotlin {
    kotlinOptions.jvmTarget = testJvmVersion.toString()
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

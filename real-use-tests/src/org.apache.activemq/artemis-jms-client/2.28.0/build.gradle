plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.apache.activemq:artemis-jms-client:$libraryVersion"
    testImplementation "org.apache.activemq:artemis-server:$libraryVersion"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:2.14.1"
    testImplementation "org.bouncycastle:bcpkix-jdk18on:1.72"
    testImplementation "org.slf4j:slf4j-simple:1.7.36"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

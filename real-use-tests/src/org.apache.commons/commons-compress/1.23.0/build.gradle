plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.apache.commons:commons-compress:$libraryVersion"
    testImplementation "org.tukaani:xz:1.9"
    testImplementation "com.github.luben:zstd-jni:1.5.4-2"
    testImplementation "org.brotli:dec:0.1.2"
    testImplementation "org.ow2.asm:asm:9.4"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

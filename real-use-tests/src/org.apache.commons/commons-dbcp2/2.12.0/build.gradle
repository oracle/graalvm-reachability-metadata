plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.apache.commons:commons-dbcp2:$libraryVersion"
    testImplementation 'com.h2database:h2:2.3.230'
    testImplementation 'org.apache.commons:commons-pool2:2.12.0'
    testImplementation 'jakarta.transaction:jakarta.transaction-api:1.3.3'
    testImplementation('org.apache.geronimo.components:geronimo-transaction:3.1.4') {
        // DBCP already supplies the javax.transaction API through jakarta.transaction-api 1.3.
        exclude group: 'org.apache.geronimo.specs', module: 'geronimo-jta_1.1_spec'
    }
    testImplementation 'org.slf4j:slf4j-simple:2.0.12'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

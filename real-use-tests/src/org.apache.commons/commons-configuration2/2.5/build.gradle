plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.apache.commons:commons-configuration2:$libraryVersion"

    // Optional integrations used by realistic configuration sources and consumers.
    testImplementation 'commons-beanutils:commons-beanutils:1.9.3'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.9.9'
    testImplementation 'org.yaml:snakeyaml:1.24'
    testImplementation 'org.apache.commons:commons-jexl:2.1.1'
    testImplementation 'commons-jxpath:commons-jxpath:1.3'
    testImplementation 'org.apache.commons:commons-vfs2:2.3'
    testImplementation 'org.springframework:spring-context:4.3.24.RELEASE'
    testImplementation 'com.h2database:h2:2.3.230'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

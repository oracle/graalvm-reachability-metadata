plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.apache.avro:avro:$libraryVersion"

    // Application JSON boundaries for Avro records and schemas.
    testImplementation "com.fasterxml.jackson.core:jackson-databind:2.22.1"
    // Compression support for Avro object container files.
    testImplementation "org.apache.commons:commons-compress:1.28.0"
    testImplementation "org.xerial.snappy:snappy-java:1.1.10.8"
    testImplementation "org.tukaani:xz:1.10"
    testImplementation "com.github.luben:zstd-jni:1.5.7-12"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

plugins {
    id "org.graalvm.internal.tck"
    id "scala"
}

String libraryVersion = tck.testedLibraryVersion.get()
int testJvmVersion = tck.testJvmVersion.get()
String scala3Version = tck.scala3Version.get()

dependencies {
    testImplementation "org.tpolecat:skunk-core_3:$libraryVersion"
    testImplementation "org.typelevel:cats-core_3:2.10.0"
    testImplementation "org.typelevel:cats-effect_3:3.5.3"
    testImplementation "co.fs2:fs2-core_3:3.9.4"
    testImplementation "co.fs2:fs2-io_3:3.9.4"
    testImplementation "org.scodec:scodec-bits_3:1.1.38"
    testImplementation "org.typelevel:otel4s-core-trace_3:0.4.0"
    testImplementation "org.tpolecat:skunk-circe_3:1.1.0-M3"
    testImplementation "io.circe:circe-core_3:0.14.6"
    testImplementation "io.circe:circe-parser_3:0.14.6"
    testImplementation "io.circe:circe-generic_3:0.14.6"
    testImplementation "org.scala-lang:scala3-library_3:$scala3Version"
    testImplementation "org.scala-lang:scala3-compiler_3:$scala3Version"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(testJvmVersion)
    }
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

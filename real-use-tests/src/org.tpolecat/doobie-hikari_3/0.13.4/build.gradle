plugins {
    id "org.graalvm.internal.tck"
    id "scala"
}

String libraryVersion = tck.testedLibraryVersion.get()
int testJvmVersion = tck.testJvmVersion.get()
String scala3Version = tck.scala3Version.get()

dependencies {
    testImplementation "org.tpolecat:doobie-hikari_3:$libraryVersion"

    // Keep the application stack on the versions used by doobie 0.13.4.
    testImplementation "org.tpolecat:doobie-core_3:0.13.4"
    testImplementation "com.zaxxer:HikariCP:4.0.3"
    testImplementation "org.typelevel:cats-core_3:2.6.1"
    testImplementation "org.typelevel:cats-effect_3:2.5.1"
    testImplementation "co.fs2:fs2-core_3:2.5.6"

    // Embedded JDBC storage and the pool's optional monitoring integrations.
    testImplementation "com.h2database:h2:2.2.224"
    testImplementation "io.dropwizard.metrics:metrics-core:3.2.5"
    testImplementation "io.dropwizard.metrics:metrics-healthchecks:3.2.5"

    testImplementation "org.scala-lang:scala3-library_3:$scala3Version"
    testImplementation "org.scala-lang:scala3-compiler_3:$scala3Version"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(testJvmVersion)
    }
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "com.github.luben:zstd-jni:$libraryVersion"
    testImplementation "org.apache.commons:commons-compress:1.27.1"
    testImplementation "io.netty:netty-codec-http:4.1.119.Final"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:2.18.3"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
    binaries {
        test {
            buildArgs.add('--initialize-at-build-time=org.apache.commons.compress.compressors.xz.XZUtils,org.apache.commons.compress.compressors.xz.XZUtils$CachedAvailability,org.apache.commons.compress.compressors.lzma.LZMAUtils,org.apache.commons.compress.compressors.lzma.LZMAUtils$CachedAvailability')
        }
    }
}

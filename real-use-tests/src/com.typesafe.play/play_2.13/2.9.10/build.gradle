plugins {
    id "org.graalvm.internal.tck"
    id "scala"
}

String libraryVersion = tck.testedLibraryVersion.get()
int testJvmVersion = tck.testJvmVersion.get()
String scala2Version = tck.scala2Version.get()

dependencies {
    testImplementation "com.typesafe.play:play_2.13:$libraryVersion"
    testImplementation "com.typesafe.play:play-test_2.13:2.9.10"
    testImplementation "com.typesafe.play:play-filters-helpers_2.13:2.9.10"
    testImplementation "com.typesafe.play:play-logback_2.13:2.9.10"
    testImplementation "com.typesafe.play:play-json_2.13:2.10.8"
    testImplementation "com.typesafe.play:twirl-api_2.13:1.6.10"
    testImplementation "com.typesafe.akka:akka-actor_2.13:2.6.21"
    testImplementation "com.typesafe.akka:akka-stream_2.13:2.6.21"
    testImplementation "com.typesafe:config:1.4.5"
    testImplementation "org.scala-lang:scala-library:$scala2Version"
    testImplementation "org.scala-lang:scala-compiler:$scala2Version"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(testJvmVersion)
    }
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

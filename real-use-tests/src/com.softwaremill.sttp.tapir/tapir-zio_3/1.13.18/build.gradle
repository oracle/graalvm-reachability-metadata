plugins {
    id "org.graalvm.internal.tck"
    id "scala"
}

String libraryVersion = tck.testedLibraryVersion.get()
int testJvmVersion = tck.testJvmVersion.get()
String scala3Version = tck.scala3Version.get()

dependencies {
    testImplementation "com.softwaremill.sttp.tapir:tapir-zio_3:$libraryVersion"
    testImplementation "com.softwaremill.sttp.tapir:tapir-zio-http-server_3:$libraryVersion"
    testImplementation "com.softwaremill.sttp.tapir:tapir-json-zio_3:$libraryVersion"
    testImplementation "com.softwaremill.sttp.tapir:tapir-openapi-docs_3:$libraryVersion"
    testImplementation "com.softwaremill.sttp.tapir:tapir-swagger-ui-bundle_3:$libraryVersion"
    testImplementation "com.softwaremill.sttp.tapir:tapir-sttp-client4_3:$libraryVersion"
    testImplementation "com.softwaremill.sttp.tapir:tapir-sttp-stub4-server_3:$libraryVersion"
    testImplementation "com.softwaremill.sttp.tapir:tapir-zio-metrics_3:$libraryVersion"
    testImplementation "com.softwaremill.sttp.apispec:openapi-circe-yaml_3:0.11.10"
    testImplementation "com.softwaremill.sttp.client4:zio_3:4.0.23"
    testImplementation "dev.zio:zio-http_3:3.8.0"
    testImplementation "dev.zio:zio-json_3:0.7.44"
    testImplementation "org.scala-lang:scala3-library_3:$scala3Version"
    testImplementation "org.scala-lang:scala3-compiler_3:$scala3Version"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(testJvmVersion)
    }
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

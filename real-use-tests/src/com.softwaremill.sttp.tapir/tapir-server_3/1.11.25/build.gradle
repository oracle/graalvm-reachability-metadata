plugins {
    id "org.graalvm.internal.tck"
    id "scala"
}

String libraryVersion = tck.testedLibraryVersion.get()
int testJvmVersion = tck.testJvmVersion.get()
String scala3Version = tck.scala3Version.get()

dependencies {
    testImplementation "com.softwaremill.sttp.tapir:tapir-server_3:$libraryVersion"

    // Serve application endpoints over loopback HTTP using the core server interpreter.
    testImplementation "com.softwaremill.sttp.tapir:tapir-jdkhttp-server_3:1.11.25"
    // Decode and encode application JSON payloads, including validation failures.
    testImplementation "com.softwaremill.sttp.tapir:tapir-json-circe_3:1.11.25"
    // Observe server interceptor metrics through an application metrics endpoint.
    testImplementation "com.softwaremill.sttp.tapir:tapir-prometheus-metrics_3:1.11.25"

    testImplementation "org.scala-lang:scala3-library_3:$scala3Version"
    testImplementation "org.scala-lang:scala3-compiler_3:$scala3Version"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(testJvmVersion)
    }
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

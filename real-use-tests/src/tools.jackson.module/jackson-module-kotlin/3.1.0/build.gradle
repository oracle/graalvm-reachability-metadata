plugins {
    id "org.graalvm.internal.tck"
    alias(libs.plugins.kotlin.jvm)
}

String libraryVersion = tck.testedLibraryVersion.get()
int testJvmVersion = tck.testJvmVersion.get()

dependencies {
    testImplementation "tools.jackson.module:jackson-module-kotlin:$libraryVersion"
    testImplementation "tools.jackson.dataformat:jackson-dataformat-yaml:$libraryVersion"
    testImplementation "tools.jackson.dataformat:jackson-dataformat-xml:$libraryVersion"
    testImplementation "tools.jackson.dataformat:jackson-dataformat-csv:$libraryVersion"
    testImplementation "org.assertj:assertj-core:3.27.3"
}

kotlin {
    jvmToolchain(testJvmVersion)
}

compileTestKotlin {
    kotlinOptions.jvmTarget = testJvmVersion.toString()
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.jetbrains.kotlin:kotlin-reflect:$libraryVersion"
    testImplementation platform("org.jetbrains.kotlin:kotlin-bom:$libraryVersion")
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.6.4"
    testImplementation "com.fasterxml.jackson.module:jackson-module-kotlin:2.13.4"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "io.grpc:grpc-netty:$libraryVersion"
    testImplementation "io.grpc:grpc-stub:$libraryVersion"
    testImplementation "io.grpc:grpc-protobuf:$libraryVersion"
    testImplementation "io.grpc:grpc-services:$libraryVersion"
    testImplementation "io.netty:netty-transport-native-epoll:4.1.79.Final:linux-x86_64"
    testImplementation "org.bouncycastle:bcpkix-jdk18on:1.72"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

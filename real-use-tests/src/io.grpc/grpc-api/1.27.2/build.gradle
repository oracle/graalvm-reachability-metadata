plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "io.grpc:grpc-api:$libraryVersion"
    testImplementation "io.grpc:grpc-core:1.27.2"
    testImplementation "io.grpc:grpc-stub:1.27.2"
    testImplementation "io.grpc:grpc-protobuf:1.27.2"
    testImplementation "io.grpc:grpc-netty-shaded:1.27.2"
    testImplementation "io.grpc:grpc-services:1.27.2"
    testImplementation "com.google.protobuf:protobuf-java:3.11.0"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

plugins {
    id "org.graalvm.internal.tck"
    id "scala"
}

String libraryVersion = tck.testedLibraryVersion.get()
int testJvmVersion = tck.testJvmVersion.get()
String scala3Version = tck.scala3Version.get()

dependencies {
    testImplementation "dev.profunktor:redis4cats-core_3:$libraryVersion"
    testImplementation "dev.profunktor:redis4cats-effects_3:$libraryVersion"
    testImplementation "dev.profunktor:redis4cats-streams_3:$libraryVersion"
    testImplementation "dev.profunktor:redis4cats-log4cats_3:$libraryVersion"
    testImplementation "org.typelevel:cats-effect_3:3.6.3"
    testImplementation "org.typelevel:log4cats-slf4j_3:2.7.1"
    testImplementation "org.slf4j:slf4j-simple:2.0.20"
    testImplementation "io.circe:circe-core_3:0.14.17"
    testImplementation "io.circe:circe-generic_3:0.14.17"
    testImplementation "io.circe:circe-parser_3:0.14.17"
    testImplementation "com.github.fppt:jedis-mock:1.1.20"
    testImplementation "org.scala-lang:scala3-library_3:$scala3Version"
    testImplementation "org.scala-lang:scala3-compiler_3:$scala3Version"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(testJvmVersion)
    }
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.jctools:jctools-core:$libraryVersion"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:2.18.3"
    testImplementation "org.slf4j:slf4j-simple:2.0.17"
    testImplementation "io.micrometer:micrometer-core:1.12.5"
    testImplementation "com.github.ben-manes.caffeine:caffeine:3.2.2"
    testImplementation "io.projectreactor:reactor-core:3.7.5"
    testImplementation "com.google.guava:guava:33.6.0-jre"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

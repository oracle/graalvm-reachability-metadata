plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "com.github.jknack:handlebars:$libraryVersion"
    testImplementation "com.github.jknack:handlebars-helpers:$libraryVersion"
    testImplementation "com.github.jknack:handlebars-jackson:$libraryVersion"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:2.22.1"
    testImplementation "joda-time:joda-time:2.12.7"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

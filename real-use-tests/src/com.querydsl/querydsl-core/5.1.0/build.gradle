plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "com.querydsl:querydsl-core:$libraryVersion"
    testImplementation "com.querydsl:querydsl-sql:$libraryVersion"
    testImplementation "com.querydsl:querydsl-collections:$libraryVersion"
    testImplementation "com.h2database:h2:2.3.232"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

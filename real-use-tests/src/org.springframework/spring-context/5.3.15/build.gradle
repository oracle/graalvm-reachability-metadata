plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.springframework:spring-context:$libraryVersion"
    testImplementation "javax.annotation:javax.annotation-api:1.3.2"
    testImplementation "javax.inject:javax.inject:1"
    testImplementation "jakarta.validation:jakarta.validation-api:2.0.2"
    testImplementation "org.hibernate.validator:hibernate-validator:6.2.5.Final"
    testImplementation "org.glassfish:javax.el:3.0.1-b12"
    testImplementation "org.aspectj:aspectjweaver:1.9.25.1"
}

graalvmNative {
    binaries {
        test {
            buildArgs.add("-H:IncludeLocales=de,fr")
        }
    }
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

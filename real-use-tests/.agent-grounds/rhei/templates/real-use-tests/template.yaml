name: real-use-tests
version: 1.0.0
description: Resolve one real-use-test issue - generate real-use scenarios for the supported library version it names in a dedicated worktree, prove them on the JVM and on Native Image, and publish them.

inputs:
  - name: issue_number
    description: Open issue labeled real-use-test whose title names the group:artifact:version to write scenarios for.
    type: number
    required: true
    validate: "[1-9][0-9]*"

  - name: scenario_passes
    description: Scenario passes; each pass adds one scenario for a subsystem nothing covers yet.
    type: number
    default: 5
    validate: "[1-9][0-9]*"

  - name: repo_checkout
    description: The repository checkout the run branches from, relative to the rendered workspace or absolute.
    type: string
    default: ../../..

  - name: worktree_root
    description: Directory that holds the run worktree, relative to the rendered workspace or absolute.
    type: string
    default: ../worktrees

  - name: worker_agent
    description: >-
      Rhei target for the preflight, generate, native-agent-fix, and
      agent-publication-fix states, as <agent>[<mode>]:<model>; the mode
      selects the reasoning level from the agent profiles in this template's
      settings.json.
    type: string
    default: pi[high]:openai-codex/gpt-5.6-luna

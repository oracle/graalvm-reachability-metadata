name: real-use-tests
version: 1.0.0
description: Generate real-use scenarios for one supported library version in a dedicated worktree, prove them on the JVM and on Native Image, and commit them for publication.

inputs:
  - name: coordinate
    description: Supported library version to write scenarios for, as group:artifact:version.
    type: string
    required: true
    validate: "[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.+-]+"

  - name: scenario_passes
    description: Scenario passes; each pass adds one scenario for a subsystem nothing covers yet.
    type: number
    default: 5
    validate: "[1-9][0-9]*"

  - name: repo_checkout
    description: The repository checkout the run branches from, relative to the rendered workspace or absolute.
    type: string
    default: ../../..

  - name: worktree_root
    description: Directory that holds the run worktree, relative to the rendered workspace or absolute.
    type: string
    default: ../worktrees

  - name: worker_agent
    description: >-
      Rhei target for the preflight, generate, native-agent-fix, and
      agent-publication-fix states, as <agent>[<mode>]:<model>; the mode
      selects the reasoning level from the agent profiles in this template's
      settings.json.
    type: string
    default: pi[high]:openai-codex/gpt-5.6-luna

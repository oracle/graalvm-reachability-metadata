grund_config_version = 1
project_name = "forge"
project_description = "Automation subproject that turns labeled issues into reviewed metadata pull requests"

[reference]
marker = "§"
trigger = "$$"
strict = true
require_grounding = false
inline_style = "citation-with-note" # citation-with-note | citation-only
inline_note_suggested_lines = 1
inline_note_max_lines = 3
inline_note_max_columns = 100
warn_on_suggested = false

[id]
format = "{kind}-{slug}" # placeholders: {kind} required; use {number}, {slug}, or both
section_separator = "."
section_heading_levels = "strict" # strict | warn | loose
number_pattern = "\\d+"
slug_pattern = "[a-z0-9][a-z0-9-]*"

[[kinds]]
prefix = "GRUND"
file = "docs/grund.md"
title = "Why: Forge motivation"

[[kinds]]
prefix = "GOAL"
file = "docs/goals.md"
title = "Where: Forge direction and outcomes"

[[kinds]]
prefix = "AR"
folder = "docs/architecture"
title = "Forge architecture and technical structure"

[[kinds]]
prefix = "FS"
folder = "docs/functional-spec"
title = "Forge functional behavior and requirements"

[[kinds]]
prefix = "DW"
file = "docs/architecture/do-work.md"
title = "Forge do-work loop architecture"

[[kinds]]
prefix = "STRAT"
file = "docs/functional-spec/strategies.md"
title = "Forge strategy configuration architecture"

[[kinds]]
prefix = "ORCH"
file = "docs/architecture/orchestration-scripts.md"
title = "Forge orchestration scripts behavior and architecture"

[[kinds]]
prefix = "GIT"
file = "docs/architecture/git-scripts.md"
title = "Forge git scripts publication behavior and architecture"

[[kinds]]
prefix = "WF"
folder = "docs/functional-spec/workflows"
title = "Forge workflow specifications and operating rules"

[[kinds]]
prefix = "E2E"
file = "docs/e2e.md"
title = "Forge end-to-end test specifications"

[[kinds]]
prefix = "BENCH"
file = "docs/functional-spec/benchmarking.md"
title = "Forge benchmark specifications"

[[kinds]]
prefix = "ROADMAP"
file = "docs/roadmap.md"
title = "Forge implementation roadmap"

[scan]
include = ["AGENTS.md", "README.md", "DEVELOPING.md", "docs", "prompt_templates"]
exclude = ["target", "node_modules", ".git", "dist", "build", ".venv", ".gradle", "out", ".venv", "**/__pycache__", "local_repositories"]
extensions = ["md", "html"]
comment_prefixes = ["//", "#", "/*", "*", "<!--"]
docstring_python = false
respect_gitignore = true

[output]
format = "text" # text | json
color = "auto" # auto | always | never
relative_paths = true

[fmt.cross_refs]
enabled = false
anchor_format = "github" # github | gitlab | mkdocs | pandoc | none

[citations]
default = "may"

[citations.GOAL]
must = ["GRUND|GOAL"]

[citations.FS]
must = ["GOAL|FS"]

[citations.AR]
must = ["FS|GOAL"]

[citations.DW]
must = ["FS|AR"]

[citations.STRAT]
should = ["FS|AR|GOAL"]

[citations.ORCH]
must = ["FS|AR|STRAT"]

[citations.GIT]
should = ["FS|AR"]

[citations.WF]
should = ["FS|STRAT|ORCH|GIT"]

[citations.E2E]
must = ["FS|WF|ORCH"]

[citations.BENCH]
must = ["FS|AR|GOAL"]

[citations.ROADMAP]
should = ["GOAL|FS|AR"]

[citations.code]
must = ["FS|AR|DW|STRAT|ORCH|GIT|WF"]

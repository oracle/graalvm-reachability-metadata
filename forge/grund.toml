grund_config_version = 1
project_name = "forge"
project_description = "Automation subproject that turns labeled issues into reviewed metadata pull requests"

[reference]
marker = "§"
trigger = "$$"
strict = true
require_grounding = false
inline_style = "citation-with-note" # citation-with-note | citation-only
inline_note_suggested_lines = 1
inline_note_max_lines = 20
inline_note_max_columns = 100
warn_on_suggested = false

[id]
format = "{kind}-{slug}" # placeholders: {kind} required; use {number}, {slug}, or both
section_separator = "."
section_heading_levels = "strict" # strict | warn | loose
number_pattern = "\\d+"
slug_pattern = "[a-z0-9][a-z0-9-]*"

[[kinds]]
kind = "GRUND"
file = "docs/grund.md"
title = "Why: Forge motivation"

[[kinds]]
kind = "GOAL"
file = "docs/goals.md"
title = "Where: Forge direction and outcomes"

[[kinds]]
kind = "AR"
folder = "docs/architecture"
title = "Forge architecture and technical structure"

[[kinds]]
kind = "FS"
folder = "docs/functional-spec"
title = "Forge functional behavior and requirements"

[[kinds]]
kind = "DW"
file = "docs/architecture/do-work.md"
title = "Forge do-work loop architecture"

[[kinds]]
kind = "STRAT"
file = "docs/functional-spec/strategies.md"
title = "Forge strategy configuration architecture"

[[kinds]]
kind = "ORCH"
file = "docs/architecture/orchestration-scripts.md"
title = "Forge orchestration scripts behavior and architecture"

[[kinds]]
kind = "GIT"
file = "docs/architecture/git-scripts.md"
title = "Forge git scripts publication behavior and architecture"

[[kinds]]
kind = "WF"
file = "docs/architecture/workflows.md"
title = "Forge workflow engines: what each one is for"

[[kinds]]
kind = "CC"
file = "docs/architecture/code-coverage-improvement.md"
title = "Forge code coverage improvement workflow, pending its own spec"

[[kinds]]
kind = "BENCH"
file = "docs/functional-spec/benchmarking.md"
title = "Forge benchmark specifications"

[[kinds]]
kind = "ROADMAP"
file = "docs/roadmap.md"
title = "Forge implementation roadmap"

# Places that are read and checked, but declare no IDs.
[[kinds]]
kind = "prompt"
folder = "prompt_templates"
citable = false
title = "Agent prompt templates the workflows render"

[[kinds]]
kind = "example"
folder = "examples"
citable = false
title = "Worked examples of a workflow run"

[[kinds]]
kind = "ai-workflows"
folder = "ai_workflows"
citable = false
title = "Workflow drivers, engines, and agent adapters"

[[kinds]]
kind = "git-scripts"
folder = "git_scripts"
citable = false
title = "Git and GitHub automation: commits, branches, PRs, stats"

[[kinds]]
kind = "utility-scripts"
folder = "utility_scripts"
citable = false
title = "Shared support code used across workflows and pipelines"

[[kinds]]
kind = "benchmarks"
folder = "benchmarks"
citable = false
title = "Benchmark campaign configuration and runner"

[[kinds]]
kind = "tests"
folder = "tests"
citable = false
title = "Unit and integration tests for the Python modules"

# Places that are listed, not walked: data that ships verbatim.
[[kinds]]
kind = "schema"
folder = "schemas"
citable = false
scan = false
title = "JSON Schemas for strategies, metrics, and continuation markers"

[[kinds]]
kind = "strategy"
folder = "strategies"
citable = false
scan = false
title = "Predefined strategy configurations"

# The homeless kind: every citation site outside every home above.
[[kinds]]
kind = "code"
citable = false
title = "Loose scripts and plugins outside a kind home"

[scan]
include = ["AGENTS.md", "README.md", "DEVELOPING.md", "docs", "scripts", "pylint_plugins", "forge_metadata.py"]
exclude = ["target", "node_modules", ".git", "dist", "build", ".venv", ".gradle", "out", "**/__pycache__", "local_repositories", "logs", "roadmap-planning", "skills"]
extensions = ["md", "html", "py"]
comment_prefixes = ["//", "#", "/*", "*", "<!--"]
docstring_python = true
respect_gitignore = true

[output]
format = "text" # text | json
color = "auto" # auto | always | never
relative_paths = true

[fmt.cross_refs]
enabled = false
anchor_format = "github" # github | gitlab | mkdocs | pandoc | none

[citations]
default = "may"

[citations.GOAL]
must = ["GRUND|GOAL"]

[citations.FS]
must = ["GOAL|FS"]

[citations.AR]
must = ["FS|GOAL"]

[citations.DW]
must = ["FS|AR"]

[citations.STRAT]
should = ["FS|AR|GOAL"]

[citations.ORCH]
must = ["FS|AR|STRAT"]

[citations.GIT]
should = ["FS|AR"]

[citations.WF]
should = ["FS|STRAT|ORCH|GIT"]

[citations.CC]
should = ["FS|AR|WF|GOAL"]

[citations.BENCH]
must = ["FS|AR|GOAL"]

[citations.ROADMAP]
should = ["GOAL|FS|AR"]

[citations.prompt]
should = ["FS|STRAT|WF|GOAL"]

[citations.example]
should = ["FS|WF|CC"]

[citations.ai-workflows]
should = ["FS|AR|DW|STRAT|ORCH|WF|CC"]

[citations.git-scripts]
should = ["FS|AR|GIT|ORCH"]

[citations.utility-scripts]
should = ["FS|AR|DW|STRAT|ORCH|GIT|WF|CC"]

[citations.benchmarks]
should = ["FS|AR|BENCH"]

[citations.tests]
should = ["FS|AR|DW|STRAT|ORCH|GIT|WF|CC|BENCH"]

[citations.code]
should = ["FS|AR|DW|STRAT|ORCH|GIT|WF|CC"]

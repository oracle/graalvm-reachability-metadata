# State machine diagram
# ---------------------
#
# Pipeline tasks (convert, prepare, api-inventory, native metadata, publication):
#   prepared -> execute -> completed / human-intervention
#
# API coverage loop (one task):
#   api-measure -- 0 (phase done) -> completed
#     |  ^     \-- 10 (uncovered remain; prompt written) -> api-cover --+
#     |  +--------------------------------------------------------------+
#     +-- step failed (exit 1/2) -> api-fix -> api-measure
#         (budget exhausted -> human-intervention)
#
# Deep coverage loop (one task): the same shape with deep-measure (JaCoCo +
# PGO + call-tree steps, exits 1-6) and deep-fix, but a pass runs as group
# sessions (§AR-code-coverage-deep-navigation.4):
#   deep-measure -- 10 -> deep-dispatch -- 10 -> deep-cover -> deep-dispatch;
#   deep-dispatch -- 0 (queue empty) -> deep-measure
#
# Final verified task (finalization only):
#   reviewed-prepared -> reviewed-execute -- 0 -> finalize-verify -- 0 -> completed
#     (exit N names the failed step -> finalize-fix -> re-run; 75/80 as before)
#
# Measurement is a deterministic program that always writes the current
# report to one fixed path and, when the loop continues, derives the cover
# prompt from that report in the same step. JaCoCo is the
# only coverage authority; PGO samples and counters are navigation guidance. An agent can
# never claim progress: only re-measurement moves the loop forward.

name: code-coverage-improvement
version: 1.0.0

states:
  prepared:
    description: Pipeline task is generated and ready for execution.
    initial: true
    concurrent: true
    program: "true"

  execute:
    description: Execute one code coverage pipeline phase.
    target: "pi:openai-codex/gpt-5.6-terra"
    concurrent: true
    instructions: |
      Execute pipeline Task {task_id}: {task_title}.

      Read the task body, prior runtime artifacts under `runtime/code-coverage/`,
      and the resolved issue worktree/work path from
      `runtime/code-coverage/issues/conversion.md` when it exists.

      Rules:
      - Use the deterministic Forge helper named by the task body. Every named
        helper and required artifact is mandatory. If a helper is missing,
        fails, or cannot produce coherent artifacts, record the blocker and
        request `human-intervention`; do not report the phase complete or
        invent replacement product behavior.
      - Keep code/docs edits inside the resolved issue worktree and work path.
      - Keep Rhei artifacts under `runtime/code-coverage/` in this workspace.
      - If metadata generation or Native Image validation cannot be resolved
        automatically, write the work artifact with the blocker and request
        `human-intervention`.

      Write `{output.work.path}` with:
      - source issue URL
      - coordinate and coverage suite path
      - worktree and work path used
      - files inspected or changed
      - phase artifacts written
      - commands run and results
      - decisions made
      - remaining risk or human follow-up
    outputs:
      - name: work
        path: runtime/code-coverage/work/{task_id}.md
        description: Execution summary for one pipeline phase.

  api-measure:
    description: JaCoCo report generation and API correlation; decides whether the API loop continues.
    concurrent: true
    visits: 16
    program: |
      python3 - "$RHEI_INPUT_CONVERSION_PATH" <<'PY'
      import json
      import os
      import re
      import shutil
      import subprocess
      import sys
      from pathlib import Path

      def fail(step: int, message: str) -> None:
          print(f"step {step}: {message}", file=sys.stderr)
          sys.exit(step)

      # Step 1: read the conversion record.
      try:
          conversion = json.load(open(sys.argv[1]))
          coordinate = conversion["coordinate"]
          worktree = conversion["worktreePath"]
          work_path = conversion["workPath"]
      except Exception as error:
          fail(1, f"conversion.json missing or invalid: {error}")

      validation = Path("runtime/code-coverage/validation")
      validation.mkdir(parents=True, exist_ok=True)
      iteration = len(list(validation.glob("api-cover-report-*.json")))

      # Step 2: JVM JaCoCo run and exact API-inventory correlation. The
      # validator resolves the tracked code-coverage-improvement suite inside
      # the coordinate's indexed test project itself.
      helper = [
          sys.executable, f"{work_path}/utility_scripts/code_coverage_validate.py",
          "--repo-path", worktree,
          "--coordinate", coordinate,
          "--api-inventory", "runtime/code-coverage/api-inventory/api-inventory.json",
          "--iteration", str(iteration),
          "--output-dir", str(validation),
      ]
      print(f"[api-measure] iteration {iteration}: {' '.join(helper)}", flush=True)
      try:
          if subprocess.run(helper, env=dict(os.environ, PYTHONPATH=work_path)).returncode != 0:
              fail(2, "code_coverage_validate.py failed")
      except OSError as error:
          fail(2, f"code_coverage_validate.py could not run: {error}")

      # The fixed handoff location the cover agent reads from.
      report_path = validation / f"api-cover-report-{iteration}.json"
      if not report_path.is_file():
          fail(2, f"helper wrote no report at {report_path}")
      shutil.copy(report_path, validation / "api-cover-report.json")

      # Decide: 0 = phase done, 10 = uncovered targets remain and budget left.
      report = json.load(open(report_path))
      uncovered = [
          entry for entry in report.get("targets", report.get("inventory", []))
          if entry.get("status") == "uncovered"
      ]
      print(f"[api-measure] iteration {iteration}: {len(uncovered)} uncovered public targets", flush=True)

      # Heuristic iteration budget: one cover pass lands at most ~250 methods
      # and roughly half the uncovered targets are reachable in practice, so
      # baseline_uncovered / 2 / 250 passes, clamped to [1, 10].
      baseline = json.load(open(validation / "api-cover-report-0.json"))
      budget = min(10, max(1, baseline["summary"]["uncovered"] // 500))
      print(f"[api-measure] iteration budget {budget} from {baseline['summary']['uncovered']} baseline uncovered targets", flush=True)
      if not uncovered or iteration >= budget:
          # An exit-zero route into `completed` leaves the ticket's terminal
          # result to this program (§AR-code-coverage-improvement.4).
          result_path = os.environ.get("RHEI_RESULT_PATH")
          if result_path:
              with open(result_path, "w", encoding="utf-8") as result:
                  result.write(f"API coverage loop completed after {iteration} iteration(s); {len(uncovered)} uncovered target(s) remain.\n")
          # Rhei checks the declared handoff output on this zero exit, so the
          # prompt path records that no cover pass follows
          # (§AR-code-coverage-improvement.5.2).
          prompt_path = Path("runtime/code-coverage/prompts/api-cover-prompt.md")
          prompt_path.parent.mkdir(parents=True, exist_ok=True)
          prompt_path.write_text(f"No cover pass follows: {len(uncovered)} uncovered target(s) remain after {iteration} iteration(s)\n")
          sys.exit(0)

      # Steering: derive the next cover prompt from the report just written.
      prompts = Path("runtime/code-coverage/prompts")
      prompts.mkdir(parents=True, exist_ok=True)
      lines = [
          "# Uncovered public API targets",
          "",
          "Write meaningful behavior tests in the dedicated coverage suite for",
          "every target below. Each id is an exact JaCoCo-uncovered public",
          "method or constructor; use realistic public API usage with real",
          "assertions, never superficial coverage-only invocation.",
          "",
      ]
      # A longer list only dilutes one cover pass; keep the top 200 targets.
      prompt_targets = uncovered[:200]
      for entry in prompt_targets:
          lines.append(f"- `{entry['id']}`")
      (prompts / "api-cover-prompt.md").write_text("\n".join(lines) + "\n")
      print(f"[api-measure] wrote prompt with {len(prompt_targets)} targets", flush=True)
      sys.exit(10)
      PY
    program_timeout: 60m
    inputs:
      - name: conversion
        path: runtime/code-coverage/issues/conversion.json
    outputs:
      # The cover agent receives this file inside its message
      # (§AR-code-coverage-improvement.5.2).
      - name: prompt
        kind: handoff
        path: runtime/code-coverage/prompts/api-cover-prompt.md
        description: Ranked cover prompt for the next API pass, or the stop summary.

  api-cover:
    description: Generate tests for the JaCoCo-uncovered public API targets in the prompt.
    target: "pi:openai-codex/gpt-5.6-terra"
    concurrent: true
    visits: 10
    # Measurement's prompt arrives inside the message
    # (§AR-code-coverage-improvement.5.2).
    handoff:
      inherit:
        - from: transition.previous
          name: prompt
          required: true
    instructions: |
      Cover uncovered public API targets for Task {task_id}: {task_title}.

      The target list is the `## Handoff from api-measure` section below:
      the cover prompt measurement rendered for this pass. Attempt every
      target in it. The file at `{input.prompt.path}` holds the same content
      on disk. Read the resolved issue worktree/coverage-suite paths from
      `runtime/code-coverage/issues/conversion.json`.

      Rules:
      - Attempt every target listed in the prompt; work across the whole batch.
      - Edit generated tests only under the tracked extension suite
        `code-coverage-improvement/src/test/java` inside the coordinate's
        indexed test project (`coverageSuiteRepoRelativePath` in
        conversion.json); never touch the regular `src/test` sources.
      - Open every test file with the CC0 header the sibling tests under
        `src/test/java` already carry, and keep the whole file ASCII: checkstyle
        runs over this suite at finalization and rejects both a missing header
        and any non-ASCII character, the grund `§` marker included.
      - Put nothing between that header and the `package` declaration;
        finalization runs Spotless (§AR-code-coverage-improvement.5.2).
      - Target meaningful public user-callable behavior with real assertions,
        not superficial coverage hits.
      - Do not weaken metadata-generation tests.
      - Do not measure or claim coverage yourself: deterministic re-measurement
        runs right after this state and decides the loop.
      - Write every test for the prompt's targets first, without running
        Gradle in between. Then, from inside the issue worktree (`worktreePath`
        in conversion.json), run the task measurement runs:
        `./gradlew codeCoverageTest -Pcoordinates=<coordinate>`. Fix whatever
        fails and run the suite again until it passes; delete a test that
        cannot pass on the JVM.
      - `codeCoverageTest` compiles and runs this suite alone and is the only
        Gradle task you run: no `spotlessApply`, no `javaTest` or regular suite,
        no native task (§AR-code-coverage-improvement.2). A Gradle invocation
        without `-Pcoordinates` configures every library in the repository,
        takes hours, and never compiles this suite; do not pass `--no-daemon`,
        which pays that cost again on every call.

      Write `{output.work.path}` with:
      - targets attempted and how each was exercised
      - files changed
      - commands run and results
      - remaining risk
    inputs:
      - name: prompt
        path: runtime/code-coverage/prompts/api-cover-prompt.md
    outputs:
      - name: work
        path: runtime/code-coverage/work/{task_id}-cover-{visit_count}.md
        description: Cover-pass summary for one API iteration.

  api-fix:
    description: Repair the cause of a failed API measurement step.
    target: "pi:openai-codex/gpt-5.6-terra"
    concurrent: true
    visits: 16
    instructions: |
      Fix the API measurement failure for Task {task_id}: {task_title}.

      The deterministic API measurement failed. Its stderr in the latest state
      log names the failed step:
      - step 1: `runtime/code-coverage/issues/conversion.json` is missing or
        invalid - repair it from the conversion task evidence.
      - step 2: the JVM JaCoCo run or correlation failed - fix the generated
        coverage tests in the issue worktree; do not weaken or delete
        meaningful assertions; never hand-craft reports.

      Fix only that cause. Measurement re-runs automatically after this state.
      Write `{output.fix.path}` with:
      - failure addressed
      - files changed
      - commands run and results
      - residual risk
    inputs:
      - name: conversion
        path: runtime/code-coverage/issues/conversion.json
    outputs:
      - name: fix
        path: runtime/code-coverage/fixes/{task_id}-{visit_count}.md
        description: Fixes applied after a failed API measurement step.

  deep-measure:
    description: JaCoCo plus instrumented and sampled PGO measurement; decides whether the deep loop continues.
    concurrent: true
    visits: 16
    program: |
      python3 - "$RHEI_INPUT_CONVERSION_PATH" <<'PY'
      import json
      import os
      import shutil
      import subprocess
      import sys
      from pathlib import Path

      def fail(step: int, message: str) -> None:
          print(f"step {step}: {message}", file=sys.stderr)
          sys.exit(step)

      # Step 1: read the conversion record.
      try:
          conversion = json.load(open(sys.argv[1]))
          coordinate = conversion["coordinate"]
          worktree = conversion["worktreePath"]
          work_path = conversion["workPath"]
      except Exception as error:
          fail(1, f"conversion.json missing or invalid: {error}")

      def run(step: int, command: list, cwd: str | None = None, env: dict | None = None) -> None:
          command = [str(part) for part in command]
          print(f"[deep-measure] step {step}: {' '.join(command)}", flush=True)
          try:
              if subprocess.run(command, cwd=cwd, env=env).returncode != 0:
                  fail(step, f"command failed: {' '.join(command[:2])}")
          except OSError as error:
              fail(step, f"command could not run: {error}")

      group, artifact, version = coordinate.split(":")
      # Indexed versions may reuse a different tests/src project. Resolve it
      # exactly as the JVM coverage validator does instead of assuming the
      # requested version names the Gradle subproject.
      sys.path.insert(0, work_path)
      from utility_scripts.metadata_index import resolve_test_dir
      subproject = Path(resolve_test_dir(worktree, group, artifact, version))
      gradle = [
          f"{worktree}/gradlew",
          f"-Pcoordinates={coordinate}",
      ]
      # The native test binary is derived from the test source set; the include
      # flag widens it with the tracked extension suite for the PGO lane only.
      include_suite = "-PincludeCodeCoverageSuite=true"
      discovery = Path("runtime/code-coverage/discovery")
      discovery.mkdir(parents=True, exist_ok=True)
      iteration = len(list(discovery.glob("discovery-report-*.json")))
      helper_env = dict(os.environ, PYTHONPATH=work_path)

      # Step 2: combined JVM JaCoCo XML (regular + extension suite) for exact
      # internal-method statuses.
      run(2, gradle + ["jacocoCodeCoverageReport"], cwd=worktree)
      jacoco_xml = subproject / "build/reports/jacoco/jacocoCodeCoverageReport/jacocoCodeCoverageReport.xml"
      if not jacoco_xml.is_file():
          fail(2, f"missing JaCoCo XML at {jacoco_xml}")
      shutil.copy(jacoco_xml, discovery / f"jacoco-deep-{iteration}.xml")

      # Step 3: instrumented, PGO-sampling image with the analysis call-tree CSV dump.
      run(3, gradle + ["nativeTestPGOSampling", include_suite], cwd=worktree)

      # Step 4: run the profiled image once; it dumps the .iprof on exit.
      profile = (discovery / f"pgo-profile-{iteration}.iprof").resolve()
      run(4, gradle + ["runNativeTestPGO", include_suite, f"-PpgoProfilePath={profile}"], cwd=worktree)
      if not profile.is_file():
          fail(4, "profiled run wrote no .iprof")

      # Step 5: copy exactly one coherent common-suffix call-tree CSV triplet.
      reports_dir = subproject / "build/native/nativeTestCompile/reports"
      triplets: dict = {}
      for csv_path in reports_dir.glob("call_tree_*.csv"):
          rest = csv_path.stem.partition("call_tree_")[2]
          csv_kind, _, suffix = rest.partition("_")
          triplets.setdefault(suffix, {})[csv_kind] = csv_path
      complete = {
          suffix: files
          for suffix, files in triplets.items()
          if {"methods", "invokes", "targets"} <= set(files)
      }
      if not complete:
          fail(5, f"no coherent call-tree CSV triplet under {reports_dir}")
      chosen = sorted(complete)[-1]
      triplet_dir = discovery / f"call-tree-{iteration}"
      triplet_dir.mkdir(exist_ok=True)
      for csv_path in complete[chosen].values():
          shutil.copy(csv_path, triplet_dir / csv_path.name)

      # Step 6: JaCoCo-exact deep paths with PGO guidance.
      analyzer = [
          sys.executable, f"{work_path}/utility_scripts/code_coverage_profile_report.py",
          "--profile", profile,
          "--reports-dir", triplet_dir,
          "--api-inventory", "runtime/code-coverage/api-inventory/api-inventory.json",
          "--jacoco-xml", discovery / f"jacoco-deep-{iteration}.xml",
          "--coordinate", coordinate,
          "--iteration", iteration,
          "--output-dir", discovery,
      ]
      run(6, analyzer, env=helper_env)

      # The fixed handoff location the cover agent reads from.
      report_path = discovery / f"discovery-report-{iteration}.json"
      if not report_path.is_file():
          fail(6, f"analyzer wrote no report at {report_path}")
      shutil.copy(report_path, discovery / "discovery-report.json")

      # Decide: 0 = phase done, 10 = actionable targets remain and budget left.
      # Bulk targets retain exhausted entries for audit; prompt IDs alone are actionable.
      # §AR-code-coverage-improvement.4.2
      report = json.load(open(report_path))
      prompt_target_ids = report.get("promptTargetIds", [])
      print(f"[deep-measure] iteration {iteration}: {len(prompt_target_ids)} actionable deep targets", flush=True)

      # Heuristic iteration budget: one cover pass lands at most ~250 methods
      # and roughly half the uncovered targets are reachable in practice, so
      # baseline_uncovered / 2 / 250 passes, clamped to [1, 10].
      baseline = json.load(open(discovery / "discovery-report-0.json"))
      budget = min(10, max(1, baseline["summary"]["deepUncovered"] // 500))
      print(f"[deep-measure] iteration budget {budget} from {baseline['summary']['deepUncovered']} baseline uncovered methods", flush=True)
      if not prompt_target_ids or iteration >= budget:
          # An exit-zero route into `completed` leaves the ticket's terminal
          # result to this program (§AR-code-coverage-improvement.4).
          result_path = os.environ.get("RHEI_RESULT_PATH")
          if result_path:
              with open(result_path, "w", encoding="utf-8") as result:
                  result.write(f"Deep coverage loop completed after {iteration} iteration(s); {len(prompt_target_ids)} target(s) remain.\n")
          # Rhei checks the declared output on this zero exit, so an empty
          # queue records that no cover session follows
          # (§AR-code-coverage-deep-navigation.4).
          queue_path = Path("runtime/code-coverage/prompts/deep-session-queue.json")
          queue_path.parent.mkdir(parents=True, exist_ok=True)
          queue_path.write_text("[]\n")
          sys.exit(0)

      # Steering: the analyzer rendered one prompt per group session; queue
      # them for the dispatcher, which hands out one per cover visit
      # (§AR-code-coverage-deep-navigation.4).
      try:
          from utility_scripts.code_coverage_deep_sessions import write_queue
          sessions = write_queue(str(report_path), "runtime/code-coverage/prompts/deep-session-queue.json")
      except Exception as error:
          fail(6, f"the session queue could not be written: {error}")
      print(f"[deep-measure] queued {sessions} sessions for {len(prompt_target_ids)} targets", flush=True)
      sys.exit(10)
      PY
    program_timeout: 120m
    inputs:
      - name: conversion
        path: runtime/code-coverage/issues/conversion.json
    outputs:
      - name: queue
        path: runtime/code-coverage/prompts/deep-session-queue.json
        description: The pass's group sessions in run order, or an empty queue when the phase stops.

  deep-dispatch:
    description: Hand the next queued group session to deep-cover, or return to measurement when the pass is spent.
    concurrent: true
    # One visit per session plus one empty-queue visit per pass, under the
    # per-pass session ceiling (§AR-code-coverage-deep-navigation.4).
    visits: 220
    program: |
      python3 - "$RHEI_INPUT_CONVERSION_PATH" <<'PY'
      import json
      import sys

      try:
          work_path = json.load(open(sys.argv[1]))["workPath"]
      except Exception as error:
          print(f"conversion.json missing or invalid: {error}", file=sys.stderr)
          sys.exit(1)
      sys.path.insert(0, work_path)
      from utility_scripts.code_coverage_deep_sessions import dispatch

      # 10 runs the next session, 0 returns to measurement, 1 parks
      # (§AR-code-coverage-deep-navigation.4).
      sys.exit(dispatch(
          "runtime/code-coverage/prompts/deep-session-queue.json",
          "runtime/code-coverage/prompts/deep-cover-prompt.md",
      ))
      PY
    program_timeout: 5m
    inputs:
      - name: conversion
        path: runtime/code-coverage/issues/conversion.json
      - name: queue
        path: runtime/code-coverage/prompts/deep-session-queue.json
    outputs:
      # The cover agent receives this file inside its message
      # (§AR-code-coverage-improvement.5.2).
      - name: prompt
        kind: handoff
        path: runtime/code-coverage/prompts/deep-cover-prompt.md
        description: The next group session's cover prompt, or a note that the pass is spent.

  deep-cover:
    description: Generate tests reaching uncovered internal paths through public behavior.
    target: "pi:openai-codex/gpt-5.6-terra"
    concurrent: true
    # A stuck session is stopped and the pass moves on
    # (§AR-code-coverage-deep-navigation.4).
    agent_timeout: 45m
    # At most 21 sessions per pass (§AR-code-coverage-deep-navigation.4).
    visits: 210
    # The dispatched session's prompt arrives inside the message
    # (§AR-code-coverage-improvement.5.2).
    handoff:
      inherit:
        - from: transition.previous
          name: prompt
          required: true
    instructions: |
      Cover uncovered internal paths for Task {task_id}: {task_title}.

      The target list is the `## Handoff from deep-dispatch` section below:
      one group session of this pass, rendered by measurement. Attempt every
      target in it. The file at `{input.prompt.path}` holds the same content
      on disk. Read the resolved issue worktree/coverage-suite paths from
      `runtime/code-coverage/issues/conversion.json`.

      Rules:
      - Attempt every listed uncovered path through its shown public entry;
        never invoke an internal target directly.
      - Never bypass Java visibility by declaring a test in a package that
        exists in the tested library. Use a distinct test-only package. A
        `public` member on a package-private class is not public user-callable
        API. If no public user-callable API reaches an internal target, leave
        that target uncovered rather than call it directly.
        §AR-code-coverage-improvement.4.2
      - Every listed path, in every section of the prompt, is a target: its
        method is uncovered according to exact JaCoCo evidence, and the
        sampled context beside it only shows how close the suite already got.
      - Under a `fork` line, each numbered branch says the line it lands on
        and how often it ran; `← target` marks the branches that lead to the
        target, so drive the condition the other way. `never dispatched here`
        names an implementation the call site never received: hand it that
        receiver. A zero count means the suite never went there, not that it
        cannot. §AR-code-coverage-deep-navigation.3
      - Edit generated tests only under the tracked extension suite
        `code-coverage-improvement/src/test/java` inside the coordinate's
        indexed test project (`coverageSuiteRepoRelativePath` in
        conversion.json); never touch the regular `src/test` sources.
      - The prompt's `Where the tests go` section says whether this session
        drives one subsystem or several: a mixed session usually changes more
        than one test file. §AR-code-coverage-deep-navigation.4
      - Open every test file with the CC0 header the sibling tests under
        `src/test/java` already carry, and keep the whole file ASCII: checkstyle
        runs over this suite at finalization and rejects both a missing header
        and any non-ASCII character, the grund `§` marker included.
      - Put nothing between that header and the `package` declaration;
        finalization runs Spotless (§AR-code-coverage-improvement.5.2).
      - Write every test for this session's targets first, without running
        Gradle in between. Then, from inside the issue worktree (`worktreePath`
        in conversion.json), run the task measurement runs:
        `./gradlew codeCoverageTest -Pcoordinates=<coordinate>`. Fix whatever
        fails and run the suite again until it passes; delete a test that
        cannot pass on the JVM. The session is stopped after 45 minutes, so
        leave time for that loop. §AR-code-coverage-deep-navigation.4
      - `codeCoverageTest` compiles and runs this suite alone and is the only
        Gradle task you run: no `spotlessApply`, no `javaTest` or regular suite,
        no native task (§AR-code-coverage-improvement.2). A Gradle invocation
        without `-Pcoordinates` configures every library in the repository,
        takes hours, and never compiles this suite; do not pass `--no-daemon`,
        which pays that cost again on every call.
      - Do not weaken metadata-generation tests.
      - Do not write any target state: measurement tracks attempts and target
        rotation deterministically from its own report history.
      - Do not measure or claim coverage yourself: deterministic re-measurement
        runs once this pass's sessions are done and decides the loop.

      Write `{output.work.path}` with:
      - paths attempted and how each public entry was driven
      - files changed
      - commands run and results
      - remaining risk
    inputs:
      - name: prompt
        path: runtime/code-coverage/prompts/deep-cover-prompt.md
    outputs:
      - name: work
        path: runtime/code-coverage/work/{task_id}-cover-{visit_count}.md
        description: Cover-pass summary for one deep iteration.

  deep-fix:
    description: Repair the cause of a failed deep measurement step.
    target: "pi:openai-codex/gpt-5.6-terra"
    concurrent: true
    visits: 16
    instructions: |
      Fix the deep measurement failure for Task {task_id}: {task_title}.

      The deterministic deep measurement failed. Its stderr in the latest state
      log names the failed step:
      - step 1: `runtime/code-coverage/issues/conversion.json` is missing or
        invalid - repair it from the conversion task evidence.
      - step 2: the JVM JaCoCo run failed - fix the generated coverage tests in
        the issue worktree; do not weaken or delete meaningful assertions.
      - step 3/4: the PGO build or run failed - inspect the Gradle
        output; repair missing reachability metadata through the native
        metadata preparation helper if needed.
      - step 5/6: measurement artifacts are missing or incoherent - repair the
        inputs; never hand-craft reports.

      Fix only that cause. Measurement re-runs automatically after this state.
      Write `{output.fix.path}` with:
      - failure addressed
      - files changed
      - commands run and results
      - residual risk
    inputs:
      - name: conversion
        path: runtime/code-coverage/issues/conversion.json
    outputs:
      - name: fix
        path: runtime/code-coverage/fixes/{task_id}-{visit_count}.md
        description: Fixes applied after a failed deep measurement step.

  reviewed-prepared:
    description: Final verified task is generated and ready for execution.
    concurrent: true
    program: "true"

  reviewed-execute:
    description: Run the deterministic finalization steps; a nonzero exit code names the failed step.
    concurrent: true
    # The first entry is the finalization run itself, not a repair, so the cap
    # is one above the repair budget it gates.
    visits: 3
    program: |
      python3 - "$RHEI_INPUT_CONVERSION_PATH" <<'PY'
      import json
      import os
      import subprocess
      import sys
      from pathlib import Path

      def fail(step: int, message: str) -> None:
          print(f"step {step}: {message}", file=sys.stderr)
          sys.exit(step)

      # Step 1: read the machine-readable conversion record.
      try:
          conversion = json.load(open(sys.argv[1]))
          coordinate = conversion["coordinate"]
          worktree_path = conversion["worktreePath"]
          work_path = conversion["workPath"]
          suite_relative = conversion["coverageSuiteRepoRelativePath"]
      except Exception as error:
          fail(1, f"conversion.json missing or invalid: {error}")

      # Step 2: checkstyle over the coordinate's subprojects, including the
      # tracked coverage suite source set.
      checkstyle_command = [
          f"{worktree_path}/gradlew",
          "checkstyle",
          f"-Pcoordinates={coordinate}",
          "--stacktrace",
      ]
      try:
          if subprocess.run(checkstyle_command, cwd=worktree_path).returncode != 0:
              fail(2, "checkstyle failed")
      except OSError as error:
          fail(2, f"checkstyle could not run: {error}")

      # Step 3: regular JVM tests plus the tracked extension suite.
      # Finalization runs no Native Image validation at this stage.
      jvm_commands = [
          [
              f"{worktree_path}/gradlew",
              task,
              f"-Pcoordinates={coordinate}",
              "--stacktrace",
          ]
          for task in ("javaTest", "codeCoverageTest")
      ]
      for jvm_command in jvm_commands:
          try:
              if subprocess.run(jvm_command, cwd=worktree_path).returncode != 0:
                  fail(3, f"JVM tests failed: {jvm_command[1]}")
          except OSError as error:
              fail(3, f"JVM tests could not run: {error}")

      # Step 4: finalize separate API/deep JaCoCo metrics and guidance-only PGO
      # evidence from the recorded reports and target state.
      def report_bounds(directory: str, stem: str) -> tuple:
          reports = sorted(
              Path(directory).glob(f"{stem}-[0-9]*.json"),
              key=lambda p: int(p.stem.rsplit("-", 1)[1]),
          )
          if not reports:
              fail(4, f"no {stem} reports under {directory}")
          return reports[0], reports[-1]

      api_baseline, api_final = report_bounds("runtime/code-coverage/validation", "api-cover-report")
      deep_baseline, deep_final = report_bounds("runtime/code-coverage/discovery", "discovery-report")
      finalize_command = [
          sys.executable,
          f"{work_path}/utility_scripts/code_coverage_finalize.py",
          "--coordinate", coordinate,
          "--coverage-suite-path", suite_relative,
          "--api-baseline", str(api_baseline),
          "--api-final", str(api_final),
          "--deep-baseline", str(deep_baseline),
          "--deep-final", str(deep_final),
          "--output-dir", "runtime/code-coverage/finalization",
      ]
      for validation_command in [checkstyle_command] + jvm_commands:
          finalize_command += ["--validation-command", " ".join(validation_command)]
      for target_state in sorted(Path("runtime/code-coverage/targets").glob("*.json")):
          finalize_command += ["--target-state", str(target_state)]
      finalize_env = dict(os.environ, PYTHONPATH=work_path)
      try:
          if subprocess.run(finalize_command, env=finalize_env).returncode != 0:
              fail(4, "code_coverage_finalize.py failed")
      except OSError as error:
          fail(4, f"code_coverage_finalize.py could not run: {error}")
      PY
    program_timeout: 90m
    inputs:
      - name: conversion
        path: runtime/code-coverage/issues/conversion.json

  finalize-verify:
    description: Deterministically verify finalization artifacts and route by outcome.
    concurrent: true
    visits: 3
    program: |
      metrics="$RHEI_INPUT_FINAL_METRICS_PATH"
      summary="$RHEI_INPUT_FINAL_SUMMARY_PATH"
      if [ ! -s "$summary" ]; then
        echo "missing or empty final-summary.md" >&2
        exit 75
      fi
      if [ ! -s "$metrics" ]; then
        echo "missing or empty final-metrics.json" >&2
        exit 75
      fi
      # The validator must come from the same work path that wrote the metrics:
      # the checkout under test is pinned in a benchmark run.
      # §FS-code-coverage-benchmarking.1
      work_path="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["workPath"])' \
          "$RHEI_INPUT_CONVERSION_PATH")" || {
        echo "conversion.json missing or invalid" >&2
        exit 75
      }
      if ! python3 "$work_path/utility_scripts/schema_validator.py" \
          code_coverage_final_metrics "$metrics" >&2; then
        echo "final-metrics.json failed schema validation" >&2
        exit 75
      fi
      python3 - "$metrics" <<'PY'
      import json, sys

      metrics = json.load(open(sys.argv[1]))
      if metrics["needsHumanIntervention"]:
          print("final metrics set needsHumanIntervention", file=sys.stderr)
          sys.exit(80)
      if metrics["targets"]["failed"]:
          print("final metrics contain failed targets", file=sys.stderr)
          sys.exit(80)
      if not metrics["validationCommands"]:
          print("final metrics record no validation commands", file=sys.stderr)
          sys.exit(75)
      PY
      status=$?
      [ "$status" -eq 0 ] || exit "$status"
      # An exit-zero route into `completed` leaves the ticket's terminal
      # result to this program (§AR-code-coverage-improvement.4).
      if [ -n "${RHEI_RESULT_PATH:-}" ]; then
        printf 'Finalization verified: metrics valid, no failed targets, no human intervention.\n' \
          > "$RHEI_RESULT_PATH"
      fi
    program_timeout: 5m
    inputs:
      - name: final-metrics
        path: runtime/code-coverage/finalization/final-metrics.json
      - name: final-summary
        path: runtime/code-coverage/finalization/final-summary.md
      - name: conversion
        path: runtime/code-coverage/issues/conversion.json

  finalize-fix:
    description: Repair the cause of a failed finalization step or verification.
    target: "pi:openai-codex/gpt-5.6-terra"
    concurrent: true
    visits: 6
    instructions: |
      Fix the finalization failure for Task {task_id}: {task_title}.

      A deterministic finalization program failed. Its stderr in the latest
      state log names the failed step or verification check:
      - step 1: `runtime/code-coverage/issues/conversion.json` is missing or
        invalid - repair it from the conversion task evidence.
      - step 2: checkstyle failed - fix the style violations in the generated
        coverage tests; do not suppress or weaken the checkstyle rules.
      - step 3: JVM tests failed - fix the generated coverage tests in the
        issue worktree; do not weaken or delete meaningful assertions.
      - step 4: `code_coverage_finalize.py` failed - repair the report or
        target-state artifacts it rejected; never edit its output by hand.
      - verification: finalization artifacts are missing, empty, or
        schema-invalid - repair the inputs and let the program regenerate them.

      Fix only that cause. The finalization steps re-run automatically after
      this state, so do not run the finalize helper to hand-craft final
      artifacts. Write `{output.fix.path}` with:
      - failure addressed
      - files changed
      - commands run and results
      - residual risk
    inputs:
      - name: conversion
        path: runtime/code-coverage/issues/conversion.json
    outputs:
      - name: fix
        path: runtime/code-coverage/fixes/{task_id}-{visit_count}.md
        description: Fixes applied after a failed finalization step or verification.

  human-intervention:
    description: Human decision or manual repair is required.
    gating: true
    instructions: |
      Stop autonomous work on Task {task_id}: {task_title}.

      A human must review the task body, the latest work artifact under
      `runtime/code-coverage/work/`, and the finalization artifacts when they
      exist. Do not transition out of this state autonomously.

  completed:
    description: Work is complete.
    final: true

  cancelled:
    description: Work was cancelled.
    final: true

transitions:
  - from: prepared
    to: execute
    description: Pipeline task enters execution.

  - from: execute
    to: completed
    description: Pipeline task wrote its artifacts.

  - from: execute
    to: human-intervention
    description: A required helper or artifact is missing or failed.

  - from: api-measure
    to: completed
    exit_code: 0
    description: No uncovered public targets remain, or the iteration budget is spent.

  - from: api-measure
    to: api-cover
    exit_code: 10
    description: Uncovered public targets remain; the prompt was written for the cover agent.

  - from: api-measure
    to: api-fix
    exit_code: 1
    condition: visitCount < visits
    description: Step 1 failed - conversion.json is missing or invalid.

  - from: api-measure
    to: api-fix
    exit_code: 2
    condition: visitCount < visits
    description: Step 2 failed - the JVM JaCoCo run or correlation failed.

  - from: api-measure
    to: human-intervention
    exit_code: 1
    condition: visitCount >= visits
    description: Step 1 still fails after the maximum fix passes.

  - from: api-measure
    to: human-intervention
    exit_code: 2
    condition: visitCount >= visits
    description: Step 2 still fails after the maximum fix passes.

  - from: api-cover
    to: api-measure
    description: Cover pass finished; re-measure deterministically.

  - from: api-cover
    to: human-intervention
    description: Cover pass requires a human decision.

  - from: api-fix
    to: api-measure
    description: Repairs applied; the API measurement re-runs.

  - from: deep-measure
    to: completed
    exit_code: 0
    description: No actionable deep targets remain, or the iteration budget is spent.

  - from: deep-measure
    to: deep-dispatch
    exit_code: 10
    description: Actionable deep targets remain; the pass's group sessions were queued.

  - from: deep-dispatch
    to: deep-cover
    exit_code: 10
    description: A queued session remains; its prompt was written for the cover agent.

  - from: deep-dispatch
    to: deep-measure
    exit_code: 0
    description: The session queue is empty; the pass is spent and measurement re-runs.

  - from: deep-dispatch
    to: human-intervention
    exit_code: 1
    description: The session queue or a session prompt is unreadable.

  - from: deep-measure
    to: deep-fix
    exit_code: 1
    condition: visitCount < visits
    description: Step 1 failed - conversion.json is missing or invalid.

  - from: deep-measure
    to: deep-fix
    exit_code: 2
    condition: visitCount < visits
    description: Step 2 failed - the JVM JaCoCo run failed.

  - from: deep-measure
    to: deep-fix
    exit_code: 3
    condition: visitCount < visits
    description: Step 3 failed - the PGO image build failed.

  - from: deep-measure
    to: deep-fix
    exit_code: 4
    condition: visitCount < visits
    description: Step 4 failed - the profiled run produced no profile.

  - from: deep-measure
    to: deep-fix
    exit_code: 5
    condition: visitCount < visits
    description: Step 5 failed - no coherent call-tree CSV triplet.

  - from: deep-measure
    to: deep-fix
    exit_code: 6
    condition: visitCount < visits
    description: Step 6 failed - the deep-path analyzer rejected its inputs.

  - from: deep-measure
    to: human-intervention
    exit_code: 1
    condition: visitCount >= visits
    description: Step 1 still fails after the maximum fix passes.

  - from: deep-measure
    to: human-intervention
    exit_code: 2
    condition: visitCount >= visits
    description: Step 2 still fails after the maximum fix passes.

  - from: deep-measure
    to: human-intervention
    exit_code: 3
    condition: visitCount >= visits
    description: Step 3 still fails after the maximum fix passes.

  - from: deep-measure
    to: human-intervention
    exit_code: 4
    condition: visitCount >= visits
    description: Step 4 still fails after the maximum fix passes.

  - from: deep-measure
    to: human-intervention
    exit_code: 5
    condition: visitCount >= visits
    description: Step 5 still fails after the maximum fix passes.

  - from: deep-measure
    to: human-intervention
    exit_code: 6
    condition: visitCount >= visits
    description: Step 6 still fails after the maximum fix passes.

  - from: deep-cover
    to: deep-dispatch
    description: Cover session finished; hand out the next session of the pass.

  - from: deep-cover
    to: human-intervention
    description: Cover pass requires a human decision.

  - from: deep-cover
    to: deep-dispatch
    timeout: 45m
    description: >-
      The session ran out of time; its tests stay in the worktree and the next
      session of the pass is handed out.

  - from: deep-fix
    to: deep-measure
    description: Repairs applied; the deep measurement re-runs.

  - from: reviewed-prepared
    to: reviewed-execute
    description: Final verified task enters execution.

  - from: reviewed-execute
    to: finalize-verify
    exit_code: 0
    description: All finalization steps passed; verify artifacts deterministically.

  - from: reviewed-execute
    to: finalize-fix
    exit_code: 1
    condition: visitCount < visits
    description: Step 1 failed - conversion.json is missing or invalid.

  - from: reviewed-execute
    to: finalize-fix
    exit_code: 2
    condition: visitCount < visits
    description: Step 2 failed - test-only metadata split, metadata validation, or the legacy Native Image config check.

  - from: reviewed-execute
    to: finalize-fix
    exit_code: 3
    condition: visitCount < visits
    description: Step 3 failed - spotlessApply or spotlessCheck rejected the coverage suite.

  - from: reviewed-execute
    to: finalize-fix
    exit_code: 4
    condition: visitCount < visits
    description: Step 4 failed - checkstyle failed for the coverage suite.

  - from: reviewed-execute
    to: finalize-fix
    exit_code: 5
    condition: visitCount < visits
    description: Step 5 failed - JVM tests with the coverage suite failed.

  - from: reviewed-execute
    to: finalize-fix
    exit_code: 6
    condition: visitCount < visits
    description: Step 6 failed - generateLibraryStats did not persist coverage.

  - from: reviewed-execute
    to: finalize-fix
    exit_code: 7
    condition: visitCount < visits
    description: Step 7 failed - code_coverage_finalize.py rejected its inputs.

  - from: reviewed-execute
    to: human-intervention
    exit_code: 1
    condition: visitCount >= visits
    description: Step 1 still fails after the maximum fix passes.

  - from: reviewed-execute
    to: human-intervention
    exit_code: 2
    condition: visitCount >= visits
    description: Step 2 still fails after the maximum fix passes.

  - from: reviewed-execute
    to: human-intervention
    exit_code: 3
    condition: visitCount >= visits
    description: Step 3 still fails after the maximum fix passes.

  - from: reviewed-execute
    to: human-intervention
    exit_code: 4
    condition: visitCount >= visits
    description: Step 4 still fails after the maximum fix passes.

  - from: reviewed-execute
    to: human-intervention
    exit_code: 5
    condition: visitCount >= visits
    description: Step 5 still fails after the maximum fix passes.

  - from: reviewed-execute
    to: human-intervention
    exit_code: 6
    condition: visitCount >= visits
    description: Step 6 still fails after the maximum fix passes.

  - from: reviewed-execute
    to: human-intervention
    exit_code: 7
    condition: visitCount >= visits
    description: Step 7 still fails after the maximum fix passes.

  - from: finalize-verify
    to: completed
    exit_code: 0
    description: Artifacts are present, schema-valid, and demand no human action.

  - from: finalize-verify
    to: finalize-fix
    exit_code: 75
    condition: visitCount < visits
    description: Artifacts are missing or invalid and can be repaired.

  - from: finalize-verify
    to: human-intervention
    exit_code: 75
    condition: visitCount >= visits
    description: Artifact problems remain after the maximum fix passes.

  - from: finalize-verify
    to: human-intervention
    exit_code: 80
    description: Final metrics demand human action (failed targets or explicit flag).

  - from: finalize-fix
    to: reviewed-execute
    description: Repairs applied; the finalization steps re-run from the start.

  - from: human-intervention
    to: execute
    description: Human requested rework of a pipeline task.

  - from: human-intervention
    to: api-measure
    description: Human requested rework of the API coverage loop.

  - from: human-intervention
    to: deep-measure
    description: Human requested rework of the deep coverage loop.

  - from: human-intervention
    to: reviewed-execute
    description: Human requested rework of the final verified task.

  - from: human-intervention
    to: completed
    description: Human approved the task as complete.

  - from: human-intervention
    to: cancelled
    description: Human cancelled the task.

  - from: "*"
    to: cancelled
    description: Cancel any non-final task.

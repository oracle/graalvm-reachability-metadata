fissile_exceptions_version = 2
[[exceptions]]
path = "forge/docs/architecture/code-coverage/workflow.md"
match = "exact"
rules = ["markdown-docs"]
kind = "deferred"
max_accepted = { value = 1000, unit = "lines" }
until = "the code coverage spec splits behavior into the functional spec"
reason = """
User-approved: behavior and architecture share one document until the promised FS split lands; docs/README.md records the same debt.
"""
[[exceptions]]
path = "tests/tck-build-logic/src/main/groovy/org.graalvm.internal.tck.gradle"
match = "exact"
rules = ["source"]
kind = "structural"
max_accepted = { value = 1100, unit = "lines" }
until = "indefinite"
reason = """
User-approved: precompiled script plugin whose bulk is Gradle DSL wiring over shared mutable
script-local state (libraryGAV, nativeImageArgs, resolver closures feeding the graalvmNative
binaries block). Splitting into further precompiled plugins changes apply-time vs body-time
evaluation and cannot be proven semantics-identical; the CI-only tasks it registers are not
verifiable locally. Pure-helper extraction tops out near 250 lines and does not reach budget.
"""
[[exceptions]]
path = "tests/tck-build-logic/src/main/groovy/org.graalvm.internal.tck-harness.gradle"
match = "exact"
rules = ["source"]
kind = "structural"
max_accepted = { value = 1100, unit = "lines" }
until = "indefinite"
reason = """
User-approved: precompiled script plugin registering the harness task surface (59 tasks) over
shared script-local state (diffCoordinates, matchingCoordinates, ci.json matrix helpers).
Splitting is not provably semantics-identical: the generateMatrix*/GITHUB_OUTPUT and
buildBaseLayer tasks are exercised only in GitHub Actions and cannot be verified locally.
"""
[[exceptions]]
path = "forge/docs/architecture/architecture.md"
match = "exact"
rules = ["markdown-docs"]
kind = "deferred"
max_accepted = { value = 1000, unit = "lines" }
until = "AR-forge-workflow-pipeline is split into per-stage declarations following the dispatcher package boundaries"
reason = """
User-approved: the bulk is one 868-line declaration (AR-forge-workflow-pipeline); carving it
renumbers cited sections across ~27 sites and is deliberate spec work, not a mechanical split.
"""
[[exceptions]]
path = "forge/docs/functional-spec/functional-spec.md"
match = "exact"
rules = ["markdown-docs"]
kind = "deferred"
max_accepted = { value = 800, unit = "lines" }
until = "its declarations are moved to topic files in the functional-spec folder home"
reason = """
User-approved: mechanical whole-declaration moves are possible but deferred; IDs are stable
across files in the folder home, so the split carries no citation churn when it happens.
"""
[[exceptions]]
path = "forge/docs/functional-spec/publication.md"
match = "exact"
rules = ["markdown-docs"]
kind = "deferred"
max_accepted = { value = 600, unit = "lines" }
until = "the review-side declarations move to a sibling file in the functional-spec folder home"
reason = """
User-approved: 65 lines over budget; the review trio (local-branch-review, automated-pr-review,
human-intervention-policy) moves out whenever the file is next substantively edited.
"""

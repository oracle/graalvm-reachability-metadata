fissile_exceptions_version = 2
[[exceptions]]
path = "forge/docs/functional-spec/benchmarking.md"
match = "exact"
rules = ["markdown-docs"]
kind = "deferred"
max_accepted = { value = 400, unit = "lines" }
until = "the code coverage benchmarking contract moves to its own functional-spec document"
reason = """
Two benchmark contracts (generation and code coverage) share one file; the code-coverage one gains the baseline arm before its own document exists.
"""
[[exceptions]]
path = "forge/docs/architecture/code-coverage/benchmarking.md"
match = "exact"
rules = ["markdown-docs"]
kind = "structural"
max_accepted = { value = 300, unit = "lines" }
until = "indefinite"
reason = """
The baseline arm definition and the benchmark control plane are one subject: the arm contract is exactly the benchmark's arm-invariance contract, so splitting them would separate the contract from its enforcement.
"""
[[exceptions]]
path = "forge/.agent-grounds/rhei/templates/code-coverage-improvement/tasks/code-coverage-improvement.md"
match = "exact"
rules = ["markdown-docs"]
kind = "structural"
max_accepted = { value = 400, unit = "lines" }
until = "indefinite"
reason = """
Rhei instantiates one task-plan file per template; the guided and naive task chains must live in this single file for the template to render either arm.
"""
[[exceptions]]
path = "forge/docs/functional-spec/functional-spec.md"
match = "exact"
rules = ["markdown-docs"]
kind = "deferred"
shadows = "hard"
max_accepted = { value = 800, unit = "lines" }
[[exceptions]]
path = "forge/docs/architecture/workflow-pipeline.md"
match = "exact"
rules = ["markdown-docs"]
kind = "deferred"
max_accepted = { value = 300, unit = "lines" }
until = "the launcher loop and its exit codes move to their own architecture document"
reason = """
The launcher loop and its exit codes are a subject of their own and belong in a child architecture document the pipeline links. Moving them renumbers the later sections of the pipeline declaration, and several open Forge branches edit those sections now, so the split waits for them to land rather than turning their edits into conflicts.
"""
[[exceptions]]
path = "forge/docs/architecture/git-scripts.md"
match = "exact"
rules = ["markdown-docs"]
kind = "deferred"
max_accepted = { value = 400, unit = "lines" }
until = "AR-pr-body's per-workflow pull request bodies and AR-actions-publication's trusted Actions publisher move to documents of their own"
reason = """
AR-forge-publication holds the local publication pipeline, the trusted Actions publisher and AR-pr-body's per-workflow pull request bodies. At 380 non-blank lines, moving the bodies (112) alone still leaves 268, over the 250 soft limit; moving the Actions publisher (79) too leaves about 189. Each is a subject of its own, and moving them is its own change, not part of an edit that only brings the not-for-native-image route's own declaration up to date.
"""
[[exceptions]]
path = "docs/functional-spec/test-contract.md"
match = "exact"
rules = ["markdown-docs"]
kind = "deferred"
max_accepted = { value = 500, unit = "lines" }
until = "section 2.7's metadata and native-flag rules move to their own functional-spec document"
reason = """
The rules for hand-written metadata and native flags (section 2.7, about a quarter of the contract) are one subject with no document of their own yet; the remaining sections are cited by number across the specs, prompts and skills, so the split has to move 2.7 as a whole and re-point its citations.
"""

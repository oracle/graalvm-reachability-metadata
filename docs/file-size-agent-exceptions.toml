fissile_exceptions_version = 2
[[exceptions]]
path = "forge/docs/functional-spec/benchmarking.md"
match = "exact"
rules = ["markdown-docs"]
kind = "deferred"
max_accepted = { value = 400, unit = "lines" }
until = "the code coverage benchmarking contract moves to its own functional-spec document"
reason = """
Two benchmark contracts (generation and code coverage) share one file; the code-coverage one gains the baseline arm before its own document exists.
"""
[[exceptions]]
path = "forge/docs/architecture/code-coverage/benchmarking.md"
match = "exact"
rules = ["markdown-docs"]
kind = "structural"
max_accepted = { value = 300, unit = "lines" }
until = "indefinite"
reason = """
The baseline arm definition and the benchmark control plane are one subject: the arm contract is exactly the benchmark's arm-invariance contract, so splitting them would separate the contract from its enforcement.
"""
[[exceptions]]
path = "forge/.agent-grounds/rhei/templates/code-coverage-improvement/tasks/code-coverage-improvement.md"
match = "exact"
rules = ["markdown-docs"]
kind = "structural"
max_accepted = { value = 400, unit = "lines" }
until = "indefinite"
reason = """
Rhei instantiates one task-plan file per template; the guided and naive task chains must live in this single file for the template to render either arm.
"""
[[exceptions]]
path = "forge/docs/functional-spec/functional-spec.md"
match = "exact"
rules = ["markdown-docs"]
kind = "deferred"
shadows = "hard"
max_accepted = { value = 800, unit = "lines" }
[[exceptions]]
path = "forge/docs/architecture/workflow-pipeline.md"
match = "exact"
rules = ["markdown-docs"]
kind = "deferred"
max_accepted = { value = 330, unit = "lines" }
until = "the launcher loop and its exit codes, or the state machine and its programs, move to an architecture document of their own"
reason = """
The launcher loop and its exit codes (sections 1 and 2, about 75 non-blank lines) are a subject of their own and belong in a child architecture document the pipeline links; so are the state machine and its programs (sections 3 and 4, about 145), which the launcher, the programs and the template cite section by section. Either move alone brings the file under the 250 soft limit, but each renumbers the later sections of the pipeline declaration or needs a new declaration ID and its citers migrated, and several open Forge branches edit those sections now, so the split waits for them to land rather than turning their edits into conflicts.
"""
[[exceptions]]
path = "forge/docs/architecture/git-scripts.md"
match = "exact"
rules = ["markdown-docs"]
kind = "deferred"
max_accepted = { value = 400, unit = "lines" }
until = "AR-pr-body's per-workflow pull request bodies and AR-actions-publication's trusted Actions publisher move to documents of their own"
reason = """
AR-forge-publication holds the local publication pipeline, the trusted Actions publisher and AR-pr-body's per-workflow pull request bodies. At 380 non-blank lines, moving the bodies (112) alone still leaves 268, over the 250 soft limit; moving the Actions publisher (79) too leaves about 189. Each is a subject of its own, and moving them is its own change, not part of an edit that only brings the not-for-native-image route's own declaration up to date, nor of a grund upgrade that only numbers the six body headings it now requires.
"""
[[exceptions]]
path = "forge/docs/functional-spec/publication.md"
match = "exact"
rules = ["markdown-docs"]
kind = "deferred"
shadows = "hard"
max_accepted = { value = 500, unit = "lines" }
[[exceptions]]
path = "docs/functional-spec/functional-spec.md"
match = "exact"
rules = ["markdown-docs"]
kind = "deferred"
max_accepted = { value = 400, unit = "lines" }
until = "FS-library-version-update-automation (section 9) moves to a document of its own in the functional-spec folder home, together with either section 8 (how the repository is used) or the native-build-tools interface contract (section 4.7), leaving about 240 lines"
reason = """
The file measures about 390 lines. The version update automation (section 9, about 90 lines) is a declaration of its own and can move out whole, since IDs are stable across files in the folder home: only the four `FS-repository-functional-spec.9` citations grund checks are re-pointed. That alone leaves about 300, so a second subject has to go with it: the usage walkthroughs of section 8 (about 60 lines), which need new IDs and their citers migrated, or the native-build-tools interface contract of section 4.7 (about 60), whose move re-points every `FS-repository-functional-spec.4.7` citation. Each move is a change of its own rather than a side effect of adding one label row or of a grund upgrade that only rewrites citations and numbers headings here.
"""
[[exceptions]]
path = "forge/dispatcher/claim_preflight.py"
match = "exact"
rules = ["source"]
kind = "deferred"
max_accepted = { value = 500, unit = "lines" }
until = "the test-only batched preflight path is removed from forge/dispatcher"
reason = """
About 300 of the file's lines are the batched preflight (resolve_next_issue_claim_candidate_batch and the GraphQL preflight, skip and cache-skip helpers it calls), which only tests reach since the launcher fetches with gh issue list; only refresh_issue_payload_for_claim and get_open_blocking_issue_numbers are live. Moving that path to a sibling module would split dead code at the line count; removing it is the design fix and a change of its own.
"""
[[exceptions]]
path = "forge/utility_scripts/host_requirements.py"
match = "exact"
rules = ["source"]
kind = "deferred"
max_accepted = { value = 600, unit = "lines" }
until = "queue-requirement resolution moves to its own module"
reason = """
Resolving which queues a run serves from the FORGE_*_LIMIT variables is a responsibility apart from the host gate and belongs in a sibling module. An open branch rewrites the imports beside that block and the gate entry points that call it, so the move waits for that branch to land rather than conflicting with it.
"""
[[exceptions]]
path = "forge/utility_scripts/host_graalvm_checks.py"
match = "exact"
rules = ["source"]
kind = "deferred"
max_accepted = { value = 600, unit = "lines" }
until = "the shared GraalVM installation helpers move to their own module"
reason = """
The GraalVM installation helpers the dispatcher and the local CI verification share with the gate, finding a lane's home and proving its installation and agent, are a responsibility apart from the gate's version checks and belong in a sibling module. An open branch adds to those helpers now, so the move waits for it to land rather than conflicting with it.
"""

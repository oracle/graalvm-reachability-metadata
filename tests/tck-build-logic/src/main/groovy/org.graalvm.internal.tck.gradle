        uri(tck.metadataRoot.get().asFile)
    }
    agent {
    }
    binaries {
        test {
            if (override) {
                excludeConfig.put(libraryGAV, [".*"])
            }
            buildArgs.addAll(nativeImageArgs)
            buildArgs.addAll(providers.provider { resolveNativeTestHarnessBuildArgs() })
        }
    }
}

nativeLayers.configure(artifacts, providers.provider { resolveNativeTestHarnessBuildArgs() })

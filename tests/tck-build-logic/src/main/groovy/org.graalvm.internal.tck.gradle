Closure<String> deriveTraceMetadataConditionPackages = {
    String explicitConditionPackages = providers.gradleProperty("traceMetadataConditionPackages").getOrElse("").trim()
    if (!explicitConditionPackages.isBlank()) {
        return explicitConditionPackages
    }

    String userCodeFilterPath = graalvmNative.agent.modes.conditional.userCodeFilterPath.getOrElse("user-code-filter.json")
    File userCodeFilterFile = file(userCodeFilterPath)
    if (!userCodeFilterFile.isFile()) {
        String fallbackPackage = libraryGAV.split(":", 2)[0]
        logger.warn("Cannot derive TraceMetadataConditionPackages for {}: {} does not exist. Falling back to {}.", libraryGAV, userCodeFilterPath, fallbackPackage)
        return fallbackPackage
    }

    def parsed = new JsonSlurper().parse(userCodeFilterFile)
    def rules = parsed instanceof Map ? parsed.rules : null
    if (!(rules instanceof List)) {
        throw new GradleException("Cannot derive TraceMetadataConditionPackages for ${libraryGAV}: ${userCodeFilterPath} must contain a rules array.")
    }

    List<String> packages = []
    rules.each { rule ->
        if (!(rule instanceof Map) || !(rule.includeClasses instanceof String)) {
            return
        }
        String includeClasses = rule.includeClasses.trim()
        if (includeClasses.isBlank() || includeClasses == "**") {
            return
        }
        String packageName = includeClasses
        if (packageName.endsWith(".**")) {
            packageName = packageName.substring(0, packageName.length() - 3)
        } else if (packageName.endsWith(".*")) {
            packageName = packageName.substring(0, packageName.length() - 2)
        } else if (packageName.contains(".")) {
            packageName = packageName.substring(0, packageName.lastIndexOf("."))
        }
        if (!packageName.isBlank() && !packages.contains(packageName)) {
            packages.add(packageName)
        }
    }

    if (packages.isEmpty()) {
        throw new GradleException("Cannot derive TraceMetadataConditionPackages for ${libraryGAV}: ${userCodeFilterPath} has no includeClasses package rules.")
    }
    return packages.join(",")
}

tasks.register("nativeTraceImage") { task ->
    task.setDescription("Builds the test native image with runtime metadata tracing support enabled")
    task.setGroup(LifecycleBasePlugin.BUILD_GROUP)
    task.dependsOn(tasks.named("nativeTestCompile"))
}

tasks.register("runNativeTraceImage", Exec) { Exec task ->
    task.setDescription("Runs the trace-enabled test native image once and writes runtime metadata trace output")
    task.setGroup(JavaBasePlugin.VERIFICATION_GROUP)
    task.dependsOn(tasks.named("nativeTraceImage"))
    task.ignoreExitValue = true
    task.doFirst {
        String traceMetadataPath = requiredAbsolutePathProperty("traceMetadataPath")
        String traceMetadataConditionPackages = deriveTraceMetadataConditionPackages()
        BuildNativeImageTask nativeTestCompile = tasks.named("nativeTestCompile", BuildNativeImageTask).get()
        NativeRunTask nativeTest = tasks.named("nativeTest", NativeRunTask).get()
        File imageFile = nativeTestCompile.outputFile.get().asFile
        List<String> runtimeArgs = []
        runtimeArgs.addAll(nativeTest.internalRuntimeArgs.get())
        runtimeArgs.addAll(nativeTest.runtimeArgs.get())
        runtimeArgs.add("-XX:TraceMetadata=path=${traceMetadataPath}")
        runtimeArgs.add("-XX:TraceMetadataConditionPackages=${traceMetadataConditionPackages}")
        task.executable = imageFile.absolutePath
        task.args = runtimeArgs
    }
    task.doLast {
        // When -PtraceBinaryExitFile=<absolute path> is supplied, write the
        // binary's exit code to that file. The verification gate reads this
        // sentinel to recover ExitStatus.MISSING_METADATA (172) without
        // grepping Gradle's log output.
        String exitFilePath = providers.gradleProperty("traceBinaryExitFile").getOrElse("")
        if (!exitFilePath.isBlank()) {
            File exitFile = file(exitFilePath)
            File parent = exitFile.parentFile
            if (parent != null) {
                parent.mkdirs()
            }
            exitFile.text = String.valueOf(task.executionResult.get().exitValue)
        }
    }
}

tasks.register("mergeNativeTraceMetadata", Exec) { Exec task ->
    task.setDescription("Merges runtime metadata trace output directories with native-image-utils generate")
    task.setGroup("Metadata")
    task.doFirst {
        List<File> inputDirs = requiredDirectoryListProperty("inputDirs", false)
        File outputDir = file(requiredAbsolutePathProperty("outputDir"))
        delete(outputDir)
        List<String> commandLineArgs = [nativeImageTool("native-image-utils"), "generate"]
        commandLineArgs.addAll(inputDirs.collect { File inputDir -> "--input-dir=${inputDir.absolutePath}" })
        commandLineArgs.add("--output-dir=${outputDir.absolutePath}")
        task.commandLine(commandLineArgs)
    }
}

// §AR-test-harness.3.1: run the forked JVM test workers on a JDK that need not be able to host
// Gradle. Selects an interpreter only — JVM arguments are left exactly as they would be otherwise.
String testJavaHome = System.getenv("GVM_TCK_TEST_JAVA_HOME")



tasks.register("nativeTestPGOSampling") { task ->
    task.inputs.property("pgoSamplingPeriodMicros", pgoSamplingPeriodMicros)
    task.setDescription("Builds the test native image with PGO instrumentation, sampling, and the analysis call-tree CSV dump enabled")
    task.setGroup(LifecycleBasePlugin.BUILD_GROUP)
    task.dependsOn(tasks.named("nativeTestCompile"))
}

tasks.register("runNativeTestPGO", Exec) { Exec task ->
    task.setDescription("Runs the profiled test native image once and writes the .iprof profile")
    task.setGroup(JavaBasePlugin.VERIFICATION_GROUP)
    task.dependsOn(tasks.named("nativeTestPGOSampling"))
    task.doFirst {
        String pgoProfilePath = requiredAbsolutePathProperty("pgoProfilePath")
        BuildNativeImageTask nativeTestCompile = tasks.named("nativeTestCompile", BuildNativeImageTask).get()
        NativeRunTask nativeTest = tasks.named("nativeTest", NativeRunTask).get()
        File imageFile = nativeTestCompile.outputFile.get().asFile
        List<String> runtimeArgs = []
        runtimeArgs.addAll(nativeTest.internalRuntimeArgs.get())
        runtimeArgs.addAll(nativeTest.runtimeArgs.get())
        // PGO images dump the profile on exit; pin the output path so the
        // analyzer reads a known location instead of a working-directory default.iprof.
        runtimeArgs.add("-XX:ProfilesDumpFile=${pgoProfilePath}")
        task.executable = imageFile.absolutePath
        task.args = runtimeArgs
    }
}

// §FS-metadata.2.3: restore the bundle conditions the agent drops (§graal/GR-80923).
ResourceBundleConditions.install(project, nativeImageTool("native-image-utils"))

// Ensure detailed exception/stacktrace logging for all Test tasks, including nativeTest
tasks.withType(Test).configureEach { Test testTask ->
    // §AR-test-harness.3: downstream pass/fail gates can run without coverage instrumentation.
    if (skipJacoco) {
        jacoco.enabled = false
    }
    // §AR-test-harness.8.1: when line matching cannot decide a call site, collect the agent's
    // compressed origin tree so the harness can match exact tracked APIs and caller methods.
    if (testTask.name == 'test' && providers.gradleProperty('dynamicAccessOriginsOutput').isPresent()) {
        String originsOutput = providers.gradleProperty('dynamicAccessOriginsOutput').get()
        testTask.jvmArgs "-agentlib:native-image-agent=config-output-dir=${originsOutput},experimental-configuration-with-origins"
        testTask.jacoco.enabled = false
        testTask.outputs.upToDateWhen { false }
    }
    if (testJavaHome != null && !testJavaHome.trim().isEmpty()) {
        // Clear the toolchain-derived launcher first: Gradle rejects a Test task that carries both
        // a configured javaLauncher and an executable, and the Kotlin/Scala coordinates pin one.
        testTask.javaLauncher.unset()
        testTask.executable = new File(new File(testJavaHome, "bin"), "java").absolutePath
    }
    systemProperty "junit.jupiter.execution.timeout.default", "${maxJUnitTestTimeoutSeconds} s"
    systemProperty "junit.jupiter.execution.timeout.mode", "enabled"
    systemProperty "junit.jupiter.execution.timeout.thread.mode.default", "separate_thread"
    testLogging {
        // Options: 'full' or 'short'; use full to include stack traces and causes
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn tasks.named("checkTestTimeoutAnnotations")
}

// §forge/AR-code-coverage-improvement.4.1: the extension suite runs and is
// measured separately from the metadata-justifying tests.
tasks.register("codeCoverageTest", Test) {
    description = "Runs the code-coverage-improvement extension suite on the JVM"
    group = JavaBasePlugin.VERIFICATION_GROUP
    testClassesDirs = sourceSets.codeCoverage.output.classesDirs
    classpath = sourceSets.codeCoverage.runtimeClasspath
    useJUnitPlatform()
    dependsOn tasks.named("checkTestTimeoutAnnotations")
    onlyIf { !sourceSets.codeCoverage.java.isEmpty() }
}

// Combined regular + extension coverage; jacocoTestReport stays the
// regular-suite baseline, so the extension delta is the difference.
tasks.register("jacocoCodeCoverageReport", org.gradle.testing.jacoco.tasks.JacocoReport) {
    description = "Generates the combined JaCoCo report for the regular and code-coverage-improvement suites"
    group = JavaBasePlugin.VERIFICATION_GROUP
    dependsOn tasks.named("codeCoverageTest")
    executionData fileTree(layout.buildDirectory.dir("jacoco")) { include "*.exec" }
    sourceDirectories.setFrom(files())
}

// §FS-tests.1, §AR-test-harness.3: nativeTest's runtimeArgs default to the test binary's;
// appendAll keeps that convention, which addAll would discard.
tasks.named("nativeTest", NativeRunTask).configure { NativeRunTask task ->
    task.runtimeArgs.appendAll(junitTimeoutRuntimeArgs)
}

 // Configure JaCoCo report to analyze only the effective classes of the target library (handles multi-release JARs)
tasks.withType(org.gradle.testing.jacoco.tasks.JacocoReport).configureEach { r ->
    r.dependsOn(tasks.named('test'))

    reports {
        xml.required = true
        html.required = false
        csv.required = false
    }

    // Classified artifacts remain executable dependencies but never enter the coverage denominator.
    List<File> matched = artifacts.resolveTestedLibraryMainJars()

    // Produce one deterministic directory of .class files that represents exactly what the JVM would load at runtime for a given library jar, without duplicates
    int runtimeMajor = (JavaVersion.current().majorVersion as int)

    def effectiveDirs = matched.collect { File jarFile ->
        String safe = jarFile.name.replaceAll(/[^A-Za-z0-9]/, '_')
        layout.buildDirectory.dir("jacoco/effective/${safe}").get().asFile
    }

    r.inputs.files(matched)
    r.outputs.dirs(effectiveDirs)

    r.doFirst {
        matched.eachWithIndex { File jarFile, int idx ->
            File outDir = effectiveDirs[idx]
            project.delete(outDir)
            // §AR-test-harness.8: not zipTree, which rejects entries stamped before 1970
            JarUtils.extractEffectiveClasses(jarFile.toPath(), runtimeMajor, outDir.toPath())
        }
    }

    r.classDirectories.setFrom(files(effectiveDirs))
    r.additionalClassDirs.setFrom()
}

// Keep harness arguments separate from coordinate policy so a base can share
// the policy without inheriting test metadata, instrumentation, or selectors. §FS-tests.3.2
Closure<List<String>> resolveNativeTestHarnessBuildArgs = {
    List<String> arguments = []
    if (realUseExactReachability) {
        // §real-use-tests/AR-real-use-test-harness.2: name each missing registration.
        arguments.add("--exact-reachability-metadata")
    }
    arguments.addAll(nativeTraceBuildArgs.get())
    arguments.addAll(pgoBuildArgs.get())
    arguments.addAll(nativeLayers.applicationBuildArgs)
    if (generateDynamicAccessReport) {
        arguments.addAll(DynamicAccessUtils.buildArgsForClasspathEntries(artifacts.resolveTestedLibraryJars()))
    }
    return arguments.collect { Object argument -> argument.toString() }
}


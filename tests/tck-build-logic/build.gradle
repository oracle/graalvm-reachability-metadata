plugins {
    id 'groovy-gradle-plugin'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    mavenLocal()
}

project.group = "org.graalvm"
project.version = "1.0.0-SNAPSHOT"

publishing {
    publications {
        library(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${buildDir}/publishing-repository")
        }
    }
}

dependencies {
    implementation(libs.nativeGradlePlugin)
    implementation 'com.networknt:json-schema-validator:1.5.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.0'
    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.1'
    testImplementation 'org.assertj:assertj-core:3.23.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The low-heap tests write their input under the build directory, never /tmp: a JVM that dies of
// OutOfMemoryError cleans nothing up, so each run first deletes what the last one left.
def lowHeapReportDir = layout.buildDirectory.dir('tmp/lowHeapReport')

// §FS-repository-functional-spec.4.2 §AR-test-harness.8: tests tagged low-heap prove that a
// report parser streams, so they run in a JVM of their own with a heap smaller than their input.
def lowHeapTests = tasks.register('lowHeapTest', Test) {
    description = 'Runs the tests tagged low-heap in a 64 MiB heap.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'low-heap'
    }
    maxHeapSize = '64m'
    systemProperty 'tck.lowHeapReportDir', lowHeapReportDir.get().asFile.absolutePath
    mustRunAfter tasks.named('test')
    doFirst {
        delete lowHeapReportDir
    }
}

test {
    useJUnitPlatform {
        excludeTags 'low-heap'
    }
}

// A low-heap failure must not keep the unit tests from running, so `check` runs both.
tasks.named('check') {
    dependsOn lowHeapTests
}

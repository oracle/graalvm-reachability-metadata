plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "com.c4-soft.springaddons:spring-addons-starter-oidc:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
    testImplementation 'org.springframework.boot:spring-boot:4.1.1'
    testImplementation 'org.springframework.boot:spring-boot-autoconfigure:4.1.1'
    testImplementation 'org.springframework.boot:spring-boot-test:4.1.1'
    testImplementation 'org.springframework.boot:spring-boot-web-server:4.1.1'
    testImplementation 'org.springframework.boot:spring-boot-webflux:4.1.1'
    testImplementation 'org.springframework.boot:spring-boot-security-oauth2-client:4.1.1'
    testImplementation 'org.springframework.boot:spring-boot-security-oauth2-resource-server:4.1.1'
    testImplementation 'org.springframework.security:spring-security-config:7.1.1'
    testImplementation 'org.springframework:spring-webmvc:7.0.9'
    testImplementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    testImplementation 'tools.jackson.core:jackson-databind:3.1.2'
    testImplementation 'org.slf4j:slf4j-api:2.0.17'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

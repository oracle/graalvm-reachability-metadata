plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "com.oracle.database.jdbc:ojdbc11:$libraryVersion"
    testImplementation "com.oracle.database.jdbc:ucp:$libraryVersion"
    testImplementation "com.oracle.database.security:oraclepki:$libraryVersion"
    testImplementation 'com.oracle.database.observability:dms:23.3.0.23.09'
    testImplementation 'jakarta.json:jakarta.json-api:2.1.3'
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

tasks.withType(Test).configureEach {
    systemProperty "oracle.jdbc.diagnostic.enableObservability", "true"
}

tasks.named("nativeTest") {
    runtimeArgs.add("-Doracle.jdbc.diagnostic.enableObservability=true")
}

graalvmNative {
    binaries {
        test {
            buildArgs.add("-Doracle.jdbc.diagnostic.enableObservability=true")
        }
    }

    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

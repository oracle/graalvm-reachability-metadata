plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.springframework:spring-context:$libraryVersion"
    testImplementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    testImplementation 'jakarta.inject:jakarta.inject-api:2.0.1'
    testImplementation 'jakarta.ejb:jakarta.ejb-api:4.0.1'
    testImplementation 'jakarta.validation:jakarta.validation-api:3.1.1'
    testImplementation 'org.hibernate.validator:hibernate-validator:9.0.1.Final'
    testImplementation 'org.glassfish.expressly:expressly:6.0.0'
    testImplementation 'org.aspectj:aspectjweaver:1.9.25'
    testImplementation 'io.projectreactor:reactor-core:3.8.0'
    testImplementation 'org.javamoney.moneta:moneta-core:1.4.4'
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

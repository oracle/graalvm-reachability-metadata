plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.springframework:spring-oxm:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
    testImplementation 'javax.xml.bind:jaxb-api:2.3.1'
    testImplementation 'org.glassfish.jaxb:jaxb-runtime:2.3.8'
    testImplementation 'com.thoughtworks.xstream:xstream:1.4.20'
}

// XStream registers HijrahDateConverter by default, and initializing
// HijrahChronology reads java.home, which a native image leaves unset.
tasks.named("nativeTest") {
    runtimeArgs.add("-Djava.home=${System.getenv('JAVA_HOME')}")
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

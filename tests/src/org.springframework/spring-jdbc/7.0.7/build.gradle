plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.springframework:spring-jdbc:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
    testImplementation 'com.h2database:h2:2.4.240'
    testImplementation 'org.hsqldb:hsqldb:2.7.3'
    testImplementation 'org.apache.derby:derby:10.16.1.1'
    testImplementation 'org.apache.derby:derbytools:10.16.1.1'
    testImplementation 'com.oracle.database.jdbc:ojdbc11:23.7.0.25.01'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

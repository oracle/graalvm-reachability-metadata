plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.glassfish.jaxb:jaxb-xjc:$libraryVersion"
    testImplementation "org.glassfish.jaxb:jaxb-runtime:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

graalvmNative {
    binaries {
        all {
            // AnnotationImpl embeds its immutable NULL_LOCATION singleton in the image heap.
            buildArgs.add('--initialize-at-build-time=com.sun.xml.xsom.impl.AnnotationImpl$LocatorImplUnmodifiable')
        }
    }
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

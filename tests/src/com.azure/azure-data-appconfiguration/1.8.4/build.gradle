plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "com.azure:azure-data-appconfiguration:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

graalvmNative {
    binaries {
        all {
            buildArgs.add('--initialize-at-build-time=org.slf4j.helpers.SubstituteLoggerFactory')
            buildArgs.add('--initialize-at-build-time=org.slf4j.helpers.NOPLoggerFactory')
            buildArgs.add('--initialize-at-build-time=com.fasterxml.jackson.core.Base64Variant')
            buildArgs.add(
                    '--initialize-at-build-time=com.fasterxml.jackson.core.Base64Variant$PaddingReadBehaviour')
        }
    }
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

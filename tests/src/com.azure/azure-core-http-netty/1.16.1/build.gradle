plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "com.azure:azure-core-http-netty:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
    testRuntimeOnly 'org.slf4j:slf4j-simple:1.7.36'
}

graalvmNative {
    binaries {
        test {
            buildArgs.add('--initialize-at-build-time=com.fasterxml.jackson.core.Base64Variant,'
                    + 'com.fasterxml.jackson.core.Base64Variant$PaddingReadBehaviour,'
                    + 'org.slf4j.helpers.NOPLoggerFactory,org.slf4j.helpers.SubstituteLoggerFactory')
        }
    }

    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

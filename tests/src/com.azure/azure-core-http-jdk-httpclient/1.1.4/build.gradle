plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()
String javaHome = System.getenv("JAVA_HOME")

dependencies {
    testImplementation "com.azure:azure-core-http-jdk-httpclient:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

tasks.named("nativeTest") {
    runtimeArgs.add("-Djava.home=${javaHome}")
}

graalvmNative {
    binaries {
        test {
            runtimeArgs.add("-Djava.home=${javaHome}")
            buildArgs.add('--enable-url-protocols=http')
            buildArgs.add('--initialize-at-build-time=com.fasterxml.jackson.core.Base64Variant,'
                    + 'com.fasterxml.jackson.core.Base64Variant$PaddingReadBehaviour,'
                    + 'org.slf4j.helpers.NOPLoggerFactory,org.slf4j.helpers.SubstituteLoggerFactory')
        }
    }

    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

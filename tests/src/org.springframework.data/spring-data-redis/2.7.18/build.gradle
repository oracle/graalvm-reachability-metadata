plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.springframework.data:spring-data-redis:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
    testImplementation 'io.lettuce:lettuce-core:6.1.10.RELEASE'
    testImplementation 'redis.clients:jedis:3.8.0'
    testImplementation 'org.apache.commons:commons-pool2:2.11.1'
    testImplementation 'io.projectreactor:reactor-core:3.4.34'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.13.5'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.13.5'
    testImplementation 'commons-beanutils:commons-beanutils:1.9.4'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.jobrunr:jobrunr-spring-boot-4-starter:$libraryVersion"
    testImplementation 'org.springframework.boot:spring-boot-autoconfigure:4.1.2'
    testImplementation 'org.springframework.boot:spring-boot-jdbc:4.1.2'
    testImplementation 'org.springframework.boot:spring-boot-health:4.1.2'
    testImplementation 'org.springframework.boot:spring-boot-micrometer-metrics:4.1.2'
    testImplementation 'tools.jackson.core:jackson-databind:3.2.3'
    testImplementation 'com.h2database:h2:2.5.252'
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

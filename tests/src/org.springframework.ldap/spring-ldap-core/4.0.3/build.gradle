plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.springframework.ldap:spring-ldap-core:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
    testImplementation 'com.unboundid:unboundid-ldapsdk:7.0.6'
    testImplementation 'commons-pool:commons-pool:1.6'
    testImplementation 'org.apache.commons:commons-pool2:2.12.1'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

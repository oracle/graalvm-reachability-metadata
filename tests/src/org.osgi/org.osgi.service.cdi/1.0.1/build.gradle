plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.osgi:org.osgi.service.cdi:$libraryVersion"
    testImplementation "org.osgi:org.osgi.framework:1.9.0"
    testImplementation "org.osgi:org.osgi.resource:1.0.1"
    testImplementation "org.osgi:org.osgi.dto:1.0.0"
    testImplementation "org.apache.geronimo.specs:geronimo-atinject_1.0_spec:1.1"
    testImplementation "org.apache.geronimo.specs:geronimo-jcdi_2.0_spec:1.1"
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

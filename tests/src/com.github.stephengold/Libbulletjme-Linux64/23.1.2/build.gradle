plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "com.github.stephengold:Libbulletjme-Linux64:$libraryVersion"

    // Native Linux x86_64 library
    testRuntimeOnly "com.github.stephengold:Libbulletjme-Linux64:$libraryVersion:SpRelease"

    // Official Libbulletjme example's native library loader
    // testImplementation "io.github.electrostat-lab:snaploader:1.2.0-stable"

    testImplementation 'org.assertj:assertj-core:3.22.0'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "io.micronaut.sourcegen:micronaut-sourcegen-annotations:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
    testImplementation "io.micronaut.sourcegen:micronaut-sourcegen-generator-java:$libraryVersion"
    testAnnotationProcessor "io.micronaut.sourcegen:micronaut-sourcegen-generator-java:$libraryVersion"
    testAnnotationProcessor "io.micronaut:micronaut-inject-java:5.1.1"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.springframework.boot:spring-boot-testcontainers:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
    testImplementation "org.springframework.boot:spring-boot-test:4.1.1"
    testImplementation("org.springframework.boot:spring-boot-data-redis:$libraryVersion") {
        transitive = false
    }
    testImplementation "org.springframework.boot:spring-boot-jdbc:$libraryVersion"
    testImplementation "com.redis:testcontainers-redis:2.2.4"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:2.0.5"
    testImplementation "org.testcontainers:testcontainers-postgresql:2.0.5"
    testRuntimeOnly "org.postgresql:postgresql:42.7.13"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

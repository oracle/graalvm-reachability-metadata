plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.springframework.boot:spring-boot:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
    testImplementation 'com.atomikos:transactions-jta:4.0.6'
    testImplementation 'com.atomikos:transactions-jdbc:4.0.6'
    testImplementation 'jakarta.transaction:jakarta.transaction-api:1.3.3'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

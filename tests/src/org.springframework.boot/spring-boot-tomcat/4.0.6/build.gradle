plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:$libraryVersion")
    testImplementation "org.springframework.boot:spring-boot-tomcat:$libraryVersion"
    // Auto-configuration, actuator management context, and context runners; versions come from the BOM.
    testImplementation 'org.springframework.boot:spring-boot-autoconfigure'
    testImplementation 'org.springframework.boot:spring-boot-actuator-autoconfigure'
    testImplementation 'org.springframework.boot:spring-boot-test'
    // Optional integrations: Tomcat metrics binder, reactive adapter, and WebSocket customizer.
    testImplementation 'io.micrometer:micrometer-core'
    testImplementation 'io.projectreactor:reactor-core'
    testImplementation 'org.apache.tomcat.embed:tomcat-embed-websocket'
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

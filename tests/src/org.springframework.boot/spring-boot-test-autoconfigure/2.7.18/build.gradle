plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.springframework.boot:spring-boot-test-autoconfigure:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
    testImplementation 'org.springframework:spring-test:5.3.31'
    testImplementation 'org.springframework:spring-webmvc:5.3.31'
    testImplementation 'org.springframework:spring-webflux:5.3.31'
    testImplementation 'org.springframework:spring-jdbc:5.3.31'
    testImplementation 'javax.servlet:javax.servlet-api:4.0.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.13.5'
    testImplementation 'com.google.code.gson:gson:2.9.1'
    testImplementation 'com.jayway.jsonpath:json-path:2.7.0'
    testImplementation 'org.skyscreamer:jsonassert:1.5.1'
    testImplementation 'org.springframework.security:spring-security-config:5.7.11'
    testImplementation 'org.springframework.security:spring-security-web:5.7.11'
    testImplementation 'org.thymeleaf:thymeleaf:3.0.15.RELEASE'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc:2.0.8.RELEASE'
    testImplementation 'org.springframework.ws:spring-ws-test:3.1.8'
    testImplementation 'org.springframework.graphql:spring-graphql-test:1.0.6'
    testImplementation 'org.seleniumhq.selenium:htmlunit-driver:3.61.0'
    testImplementation 'com.h2database:h2:2.1.214'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

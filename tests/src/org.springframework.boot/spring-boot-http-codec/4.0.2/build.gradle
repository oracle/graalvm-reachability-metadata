plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    // Companion versions come from the Spring Boot BOM, which tracks the tested release.
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:$libraryVersion")
    testImplementation "org.springframework.boot:spring-boot-http-codec:$libraryVersion"
    testImplementation "org.springframework.boot:spring-boot-jackson:$libraryVersion"
    testImplementation 'tools.jackson.core:jackson-databind'
    testImplementation 'io.projectreactor:reactor-core'
    testImplementation 'org.assertj:assertj-core'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

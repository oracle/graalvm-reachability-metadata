plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation("org.jboss:jboss-common-core:$libraryVersion") {
        // The original POM uses retired repository coordinates; XML APIs are supplied by the JDK.
        exclude group: 'apache-xerces', module: 'xml-apis'
        exclude group: 'apache-httpclient', module: 'commons-httpclient'
        exclude group: 'oswego-concurrent', module: 'concurrent'
        exclude group: 'apache-slide', module: 'webdavlib'
        exclude group: 'jboss', module: 'jboss-common-logging-spi'
    }
    testImplementation 'commons-httpclient:commons-httpclient:2.0.2'
    testImplementation 'concurrent:concurrent:1.3.4'
    testImplementation 'slide:slide-webdavlib:2.1'
    testImplementation 'org.jboss.logging:jboss-logging-jdk:2.0.5.GA'
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

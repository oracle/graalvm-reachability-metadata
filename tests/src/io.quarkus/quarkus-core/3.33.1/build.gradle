plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "io.quarkus:quarkus-core:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

graalvmNative {
    binaries {
        test {
            // quarkus-core ships io.quarkus.runtime.graal substitutions that native-image
            // applies from the class path. They assume the Quarkus build, which initializes
            // classes at build time: setter-less @InjectAccessors on Inet and CidrAddress
            // fields, and a build-time QuarkusDelayedHandler for InitialConfigurator.
            buildArgs.add('--initialize-at-build-time=io.smallrye.common.net.Inet')
            buildArgs.add('--initialize-at-build-time=io.smallrye.common.net.CidrAddress')
            buildArgs.add('--initialize-at-build-time=io.quarkus.bootstrap.logging.QuarkusDelayedHandler')
            // Workaround for oracle/graal#14812 (GR-80946): the builder resolves JDK
            // System.Loggers through jboss-logmanager's LoggerFinder service, which installs its
            // LogManager, and keeps them in build-time initialized JDK fields such as
            // EventHelper.securityLogger, so java.util.logging state reaches the image heap.
            buildArgs.add('--initialize-at-build-time=org.jboss.logmanager.LogManager')
            buildArgs.add('--initialize-at-build-time=org.jboss.logmanager.JBossLoggerFinder')
            buildArgs.add('--initialize-at-build-time=org.jboss.logmanager.JBossLoggerFinder$JBossSystemLogger')
            buildArgs.add('--initialize-at-build-time=org.jboss.logmanager.Level')
            buildArgs.add('--initialize-at-build-time=org.jboss.logmanager.AtomicArray')
            buildArgs.add('--initialize-at-build-time=org.jboss.logmanager.errormanager.OnlyOnceErrorManager')
            buildArgs.add('--initialize-at-build-time=org.jboss.logmanager.errormanager.SimpleErrorManager')
        }
    }
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

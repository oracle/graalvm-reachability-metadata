plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "net.ttddyy.observation:datasource-micrometer-spring-boot:$libraryVersion"
    testImplementation "net.ttddyy.observation:datasource-micrometer-opentelemetry:$libraryVersion"
    testImplementation "org.springframework.boot:spring-boot-test:4.1.1"
    testImplementation "com.h2database:h2:2.4.240"
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

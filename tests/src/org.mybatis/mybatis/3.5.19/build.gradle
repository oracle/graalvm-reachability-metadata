plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.mybatis:mybatis:$libraryVersion"
    testImplementation 'org.javassist:javassist:3.30.2-GA'
    testImplementation 'com.h2database:h2:2.1.210'
    testImplementation 'org.slf4j:slf4j-api:2.0.16'
    testImplementation 'commons-logging:commons-logging:1.3.4'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.24.3'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

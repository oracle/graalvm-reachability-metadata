plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "io.micronaut.security:micronaut-security-ojdbc-extensions:$libraryVersion"
    testImplementation 'com.oracle.database.jdbc:ojdbc11:23.26.2.0.0'
    testImplementation 'com.oracle.database.jdbc:ojdbc-provider-common:1.1.0'
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "io.micrometer:micrometer-core:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
    // Optional integrations whose binders perform the library's dynamic access.
    testImplementation 'org.aspectj:aspectjweaver:1.9.22.1'
    testImplementation 'com.hazelcast:hazelcast:5.5.0'
    testImplementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'org.apache.kafka:kafka-clients:4.2.0'
    testImplementation 'org.eclipse.jetty:jetty-server:9.4.58.v20250814'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()
int testJvmVersion = tck.testJvmVersion.get()

dependencies {
    testImplementation "org.aspectj:aspectjweaver:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(testJvmVersion)
    options.compilerArgs.add("--enable-preview")
}

tasks.withType(Test).configureEach {
    jvmArgs "--enable-preview", "--add-opens=java.base/java.lang=ALL-UNNAMED"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
    binaries {
        all {
            buildArgs.add("--enable-preview")
            buildArgs.add("--add-opens=java.base/java.lang=ALL-UNNAMED")
        }
    }
}

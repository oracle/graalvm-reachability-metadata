import org.gradle.api.GradleException

plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.aspectj:aspectjweaver:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

tasks.named("compileTestJava").configure {
    doLast {
        // ASM experimental visitors require the caller class file's preview minor version.
        File visitorClass = destinationDirectory.file(
                "org_aspectj/aspectjweaver/ExperimentalClassApiVisitor.class"
        ).get().asFile
        byte[] classBytes = visitorClass.bytes
        if (classBytes.length < 8
                || classBytes[0] != (byte) 0xCA
                || classBytes[1] != (byte) 0xFE
                || classBytes[2] != (byte) 0xBA
                || classBytes[3] != (byte) 0xBE) {
            throw new GradleException("Unexpected ExperimentalClassApiVisitor class file")
        }
        classBytes[4] = (byte) 0xFF
        classBytes[5] = (byte) 0xFF
        visitorClass.bytes = classBytes
    }
}

tasks.withType(Test).configureEach {
    jvmArgs "--enable-preview", "--add-opens=java.base/java.lang=ALL-UNNAMED"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
    binaries {
        all {
            buildArgs.add("--enable-preview")
            buildArgs.add("--add-opens=java.base/java.lang=ALL-UNNAMED")
        }
    }
}

import org.gradle.api.tasks.testing.Test

plugins {
    id "org.graalvm.internal.tck"
    id "org.jetbrains.kotlin.jvm" version "2.5.0-Beta1"
}

String libraryVersion = tck.testedLibraryVersion.get()
int testJvmVersion = tck.testJvmVersion.get()
String directMetadataArgument = "-Dkotlin.reflect.jvm.loadMetadataDirectly=true"

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-reflect:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

kotlin {
    jvmToolchain(testJvmVersion)
}

compileTestKotlin {
    kotlinOptions.jvmTarget = testJvmVersion.toString()
}

tasks.withType(Test).configureEach {
    jvmArgs(directMetadataArgument)
}

graalvmNative {
    binaries {
        test {
            buildArgs.add('--no-fallback')
            runtimeArgs.add(directMetadataArgument)
        }
    }
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

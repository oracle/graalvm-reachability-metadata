plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.apache.cxf:cxf-rt-databinding-jaxb:$libraryVersion"
    testImplementation 'asm:asm:3.3.1'
    testImplementation 'org.assertj:assertj-core:3.22.0'
    testImplementation 'javax.annotation:javax.annotation-api:1.3.2'
    testImplementation "javax.xml.bind:jaxb-api:2.1"
}

graalvmNative {
    binaries {
        test {
            buildArgs.add('--initialize-at-run-time=com.sun.xml.bind.v2.runtime.reflect.opt.AccessorInjector,'
                    + 'com.sun.xml.bind.v2.runtime.reflect.opt.Injector,'
                    + 'com.sun.xml.bind.v2.runtime.unmarshaller.UnmarshallingContext')
        }
    }
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

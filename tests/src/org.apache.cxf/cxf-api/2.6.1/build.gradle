plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.apache.cxf:cxf-api:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
    testImplementation 'javax.xml.bind:jaxb-api:2.2.12'
    testImplementation 'com.sun.xml.bind:jaxb-core:2.2.11'
    testImplementation 'com.sun.xml.bind:jaxb-impl:2.2.11'
    testImplementation 'javax.activation:activation:1.1.1'
    testImplementation 'javax.annotation:javax.annotation-api:1.3.2'
    testImplementation 'org.springframework:spring-beans:3.0.7.RELEASE'
    testImplementation 'org.springframework:spring-context:3.0.7.RELEASE'
    testImplementation 'org.slf4j:slf4j-api:1.7.36'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

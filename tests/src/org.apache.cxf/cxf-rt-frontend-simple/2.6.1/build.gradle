plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation("org.apache.cxf:cxf-rt-frontend-simple:$libraryVersion") {
        // This suite selects SourceDataBinding rather than the default JAXB provider.
        exclude group: "org.apache.cxf", module: "cxf-rt-databinding-jaxb"
    }
    testImplementation "org.apache.cxf:cxf-rt-bindings-xml:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
    testImplementation 'javax.annotation:javax.annotation-api:1.3.2'
    testImplementation 'javax.xml.bind:jaxb-api:2.3.1'
    testImplementation "org.apache.cxf:cxf-rt-transports-local:$libraryVersion"
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

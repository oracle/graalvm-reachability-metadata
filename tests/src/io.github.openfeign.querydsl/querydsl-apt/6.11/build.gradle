plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "io.github.openfeign.querydsl:querydsl-apt:$libraryVersion"
    testAnnotationProcessor "io.github.openfeign.querydsl:querydsl-apt:$libraryVersion"
    testImplementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    testImplementation 'org.hibernate.orm:hibernate-core:6.5.0.Final'
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
            "-processor", "com.querydsl.apt.QuerydslAnnotationProcessor",
            "-Aquerydsl.variableNameFunctionClass=com.querydsl.codegen.DefaultVariableNameFunction"
    ]
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

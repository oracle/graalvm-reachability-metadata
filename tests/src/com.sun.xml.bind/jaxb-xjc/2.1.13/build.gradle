plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "com.sun.xml.bind:jaxb-xjc:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
}

graalvmNative {
    binaries.all {
        // JAXB's static dummy locator must not enter the image heap.
        buildArgs.add('--initialize-at-run-time=com.sun.xml.bind.v2.runtime.unmarshaller.UnmarshallingContext')
        // XSOM also retains a static locator for annotations without a source location.
        buildArgs.add('--initialize-at-run-time=com.sun.xml.xsom.impl.AnnotationImpl')
        // Defer the optional optimized-accessor injector's reflective class-loader access.
        buildArgs.add('--initialize-at-run-time=com.sun.xml.bind.v2.runtime.reflect.opt.Injector')
    }
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

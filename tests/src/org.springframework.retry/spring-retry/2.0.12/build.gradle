plugins {
    id "org.graalvm.internal.tck"
}

String libraryVersion = tck.testedLibraryVersion.get()

dependencies {
    testImplementation "org.springframework.retry:spring-retry:$libraryVersion"
    testImplementation 'org.assertj:assertj-core:3.22.0'
    testImplementation 'org.springframework:spring-context:6.0.23'
    testImplementation 'org.aspectj:aspectjweaver:1.9.22.1'
    testImplementation 'io.micrometer:micrometer-core:1.10.13'
}

graalvmNative {
    agent {
        defaultMode = "conditional"
        modes {
            conditional {
                userCodeFilterPath = "user-code-filter.json"
            }
        }
    }
}

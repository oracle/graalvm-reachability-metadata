openapi: 3.0.0
info:
  title: GreetingAPI
  version: 1.0.0
paths:
  /hello:
    get:
      operationId: getGreeting
      responses:
        "200":
          description: A friendly greeting
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
              example:
                message: Hello from Microcks

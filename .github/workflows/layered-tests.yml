# Weekly full sweep and manual test for the cached layered Native Image lane. §AR-layered-tests.
name: "Layered tests"
run-name: ${{ inputs.shard != '' && format('Layered shard {0} {1} {2}', inputs.sweep-run-id, inputs.shard, inputs.dispatch-token) || inputs.sweep-run-id != '' && format('Layered queue {0}', inputs.sweep-run-id) || github.event.schedule == '17,37,57 * * * *' && 'Layered queue recovery' || 'Layered sweep' }}

on:
  schedule:
    - cron: "30 0 * * 0"
    - cron: "17,37,57 * * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "Layered tests to run"
        required: true
        type: choice
        options:
          - "Shared Layered Tests"
          - "Dedicated Layered Tests"
          - "All Layered Tests"
        default: "All Layered Tests"
      ref:
        description: "Branch, tag, or SHA to test"
        required: true
        default: "master"
      coordinates:
        description: "Coordinates to test"
        required: true
        default: "all"
      java-version:
        description: "GraalVM Java version"
        required: true
        default: "latest-ea"
      native-image-mode:
        description: "Native Image mode from ci.json"
        required: true
        default: "current-defaults"
      sweep-run-id:
        description: "Existing sweep to resume or cancel (empty starts a new sweep)"
        default: ""
      shard:
        description: "Internal dispatcher shard index"
        default: ""
      dispatch-token:
        description: "Internal dispatcher submission identity"
        default: ""
      cancel-sweep:
        description: "Cancel the sweep identified above"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "layered-${{ inputs.sweep-run-id || format('{0}-{1}-{2}-{3}-{4}-{5}', github.event.schedule, inputs.lane, inputs.ref, inputs.coordinates, inputs.java-version, inputs.native-image-mode) }}-${{ inputs.shard }}-${{ inputs.dispatch-token }}"
  cancel-in-progress: true

jobs:
  prepare-shards:
    if: inputs.sweep-run-id == '' && github.event.schedule != '17,37,57 * * * *'
    name: "Prepare layered test shards"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      revision: ${{ steps.revision.outputs.sha }}

    steps:
      - name: "Resolve test ref"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}

      - name: "Record test revision"
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: "Create coordinate matrix"
        id: matrix
        env:
          COORDINATES: ${{ inputs.coordinates || 'all' }}
          LAYER_SELECTION: ${{ inputs.lane || 'All Layered Tests' }}
        run: |
          matrix="$(jq -cn \
            --arg coordinates "${COORDINATES}" \
            --arg selection "${LAYER_SELECTION}" '
            [
              {
                selection: "Shared Layered Tests",
                shards: 32,
                name: "Shared"
              },
              {
                selection: "Dedicated Layered Tests",
                shards: 128,
                name: "Dedicated"
              }
            ]
            | if $selection == "All Layered Tests" then . else map(select(.selection == $selection)) end
            | {include: [
                .[] as $lane
                | (if $coordinates == "all" then
                    range(1; $lane.shards + 1) | "\(.)/\($lane.shards)"
                  else $coordinates end) as $coordinate
                | {lane: $lane, coordinates: $coordinate}
              ]}')"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  prepare:
    needs: prepare-shards
    uses: ./.github/workflows/layered-test-shards.yml
    with:
      prepare-shared-base: ${{ inputs.lane != 'Dedicated Layered Tests' }}
      ref: ${{ needs.prepare-shards.outputs.revision }}
      java-version: ${{ inputs.java-version || 'latest-ea' }}
      native-image-mode: ${{ inputs.native-image-mode || 'current-defaults' }}

  discover:
    if: inputs.shard == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      matrix: ${{ steps.queues.outputs.matrix }}
      found: ${{ steps.queues.outputs.found }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - id: queues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY: ${{ github.event.schedule == '17,37,57 * * * *' }}
          SWEEP_RUN_ID: ${{ inputs.sweep-run-id || github.run_id }}
        run: |
          if [[ "${RECOVERY}" == "true" ]]; then
            PYTHONPATH=.github/scripts python3 -m layered_queue.cli discover
          else
            echo "matrix=$(jq -cn --arg sweep "${SWEEP_RUN_ID}" '{sweep: [$sweep]}')" >> "${GITHUB_OUTPUT}"
            echo "found=true" >> "${GITHUB_OUTPUT}"
          fi

  dispatch:
    needs: [prepare-shards, prepare, discover]
    if: ${{ !cancelled() && needs.discover.outputs.found == 'true' && (needs.prepare.outputs.graalvm-artifact != '' || inputs.sweep-run-id != '' || github.event.schedule == '17,37,57 * * * *') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    permissions:
      contents: read
      actions: write
      checks: write
    uses: ./.github/workflows/layered-queue.yml
    with:
      sweep-run-id: ${{ matrix.sweep }}
      initialize: ${{ matrix.sweep == format('{0}', github.run_id) }}
      coordinate-matrix: ${{ needs.prepare-shards.outputs.matrix }}
      ref: ${{ needs.prepare-shards.outputs.revision }}
      native-image-mode: ${{ inputs.native-image-mode || 'current-defaults' }}
      graalvm-artifact: ${{ needs.prepare.outputs.graalvm-artifact }}
      base-artifact: ${{ needs.prepare.outputs.base-artifact }}
      cancel-sweep: ${{ inputs.cancel-sweep || false }}

  shard:
    if: inputs.sweep-run-id != '' && inputs.shard != ''
    permissions:
      contents: read
      actions: read
      checks: read
    uses: ./.github/workflows/layered-test-shard.yml
    with:
      sweep-run-id: ${{ inputs.sweep-run-id }}
      shard: ${{ inputs.shard }}
      dispatch-token: ${{ inputs.dispatch-token }}

  refill:
    needs: shard
    if: ${{ !cancelled() && inputs.sweep-run-id != '' && inputs.shard != '' }}
    permissions:
      contents: read
      actions: write
      checks: write
    uses: ./.github/workflows/layered-queue.yml
    with:
      sweep-run-id: ${{ inputs.sweep-run-id }}
      completed-run-id: ${{ github.run_id }}

# Weekly full sweep and manual test for the cached layered Native Image lane. §AR-layered-tests.
name: "Layered tests"

on:
  schedule:
    - cron: "30 0 * * 0"
  workflow_dispatch:
    inputs:
      lane:
        description: "Layered tests to run"
        required: true
        type: choice
        options:
          - "Shared Layered Tests"
          - "Dedicated Layered Tests"
          - "All Layered Tests"
        default: "All Layered Tests"
      ref:
        description: "Branch, tag, or SHA to test"
        required: true
        default: "master"
      coordinates:
        description: "Coordinates to test"
        required: true
        default: "all"
      java-version:
        description: "GraalVM Java version"
        required: true
        default: "latest-ea"
      native-image-mode:
        description: "Native Image mode from ci.json"
        required: true
        default: "current-defaults"

permissions:
  contents: read

concurrency:
  group: "layered-${{ github.event.schedule }}-${{ inputs.lane }}-${{ inputs.ref }}-${{ inputs.coordinates }}-${{ inputs.java-version }}-${{ inputs.native-image-mode }}"
  cancel-in-progress: true

jobs:
  prepare-shards:
    name: "Prepare layered test shards"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      revision: ${{ steps.revision.outputs.sha }}

    steps:
      - name: "Resolve test ref"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}

      - name: "Record test revision"
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: "Create coordinate matrix"
        id: matrix
        env:
          COORDINATES: ${{ inputs.coordinates || 'all' }}
          LAYER_SELECTION: ${{ inputs.lane || 'All Layered Tests' }}
        run: |
          matrix="$(jq -cn \
            --arg coordinates "${COORDINATES}" \
            --arg selection "${LAYER_SELECTION}" '
            [
              {
                selection: "Shared Layered Tests",
                shards: 32,
                name: "Shared"
              },
              {
                selection: "Dedicated Layered Tests",
                shards: 128,
                name: "Dedicated"
              }
            ]
            | if $selection == "All Layered Tests" then . else map(select(.selection == $selection)) end
            | {include: [
                .[] as $lane
                | (if $coordinates == "all" then
                    range(1; $lane.shards + 1) | "\(.)/\($lane.shards)"
                  else $coordinates end) as $coordinate
                | {lane: $lane.name, coordinates: $coordinate}
              ]}')"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  prepare:
    needs: prepare-shards
    uses: ./.github/workflows/layered-test-prepare.yml
    with:
      prepare-shared-base: ${{ inputs.lane != 'Dedicated Layered Tests' }}
      ref: ${{ needs.prepare-shards.outputs.revision }}
      java-version: ${{ inputs.java-version || 'latest-ea' }}
      native-image-mode: ${{ inputs.native-image-mode || 'current-defaults' }}

  layered-tests:
    needs: [prepare-shards, prepare]
    if: ${{ !cancelled() && needs.prepare.outputs.graalvm-artifact != '' }}
    uses: ./.github/workflows/layered-test-shards.yml
    with:
      coordinate-matrix: ${{ needs.prepare-shards.outputs.matrix }}
      ref: ${{ needs.prepare-shards.outputs.revision }}
      native-image-mode: ${{ inputs.native-image-mode || 'current-defaults' }}
      graalvm-artifact: ${{ needs.prepare.outputs.graalvm-artifact }}
      base-artifact: ${{ needs.prepare.outputs.base-artifact }}

# Weekly full sweep and manual test for the cached layered Native Image lane. §AR-layered-tests.
name: "Layered tests"

on:
  schedule:
    - cron: "30 0 * * 0"
  workflow_dispatch:
    inputs:
      lane:
        description: "Layered tests to run"
        required: true
        type: choice
        options:
          - "Shared Layered Tests"
          - "Dedicated Layered Tests"
          - "All Layered Tests"
        default: "All Layered Tests"
      ref:
        description: "Branch, tag, or SHA to test"
        required: true
        default: "master"
      coordinates:
        description: "Coordinates to test"
        required: true
        default: "all"
      java-version:
        description: "GraalVM Java version"
        required: true
        default: "latest-ea"
      native-image-mode:
        description: "Native Image mode from ci.json"
        required: true
        default: "current-defaults"

permissions:
  contents: read

concurrency:
  group: "workflow = ${{ github.workflow }}, lane = ${{ inputs.lane || 'All Layered Tests' }}, ref = ${{ inputs.ref || github.event.repository.default_branch }}, coordinates = ${{ inputs.coordinates || 'all' }}, java = ${{ inputs.java-version || 'latest-ea' }}, mode = ${{ inputs.native-image-mode || 'current-defaults' }}"
  cancel-in-progress: true

jobs:
  prepare-shards:
    name: "Prepare layered test shards"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      second-matrix: ${{ steps.matrix.outputs.second-matrix }}
      has-second-batch: ${{ steps.matrix.outputs.has-second-batch }}
      revision: ${{ steps.revision.outputs.sha }}

    steps:
      - name: "Resolve test ref"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}

      - name: "Record test revision"
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: "Create coordinate matrix"
        id: matrix
        env:
          COORDINATES: ${{ inputs.coordinates || 'all' }}
          LAYER_SELECTION: ${{ inputs.lane || 'All Layered Tests' }}
        run: |
          matrix="$(jq -cn \
            --arg coordinates "${COORDINATES}" \
            --arg selection "${LAYER_SELECTION}" '
            [
              {
                selection: "Shared Layered Tests",
                shards: 32,
                name: "Shared",
                exclusions: "tests/tck-build-logic/src/main/resources/shared-layered-test-exclusions.txt",
                task: "testSharedLayer",
                failureReport: "shared-layer-test-failures.txt",
                deleteDedicatedLayer: "false"
              },
              {
                selection: "Dedicated Layered Tests",
                shards: 128,
                name: "Dedicated",
                exclusions: "tests/tck-build-logic/src/main/resources/dedicated-layer-test-exclusions.txt",
                task: "testDedicatedLayer",
                failureReport: "dedicated-layer-test-failures.txt",
                deleteDedicatedLayer: "true"
              }
            ]
            | if $selection == "All Layered Tests" then . else map(select(.selection == $selection)) end
            | [
                .[] as $lane
                | {
                    lane: $lane,
                    coordinateMatrix: {
                      coordinates: (if $coordinates == "all" then
                        [range(1; $lane.shards + 1) | "\(.)/\($lane.shards)"]
                      else
                        [$coordinates]
                      end)
                    }
                  }
              ] as $lanes
            | {
                first: {include: [
                  $lanes[]
                  | if .lane.name == "Dedicated" and $coordinates == "all" then
                      .coordinateMatrix.coordinates |= .[:length / 2]
                    else . end
                ]},
                second: {include: [
                  $lanes[]
                  | select(.lane.name == "Dedicated" and $coordinates == "all")
                  | .coordinateMatrix.coordinates |= .[length / 2:]
                ]}
              }')"
          echo "matrix=$(jq -c '.first' <<< "${matrix}")" >> "${GITHUB_OUTPUT}"
          echo "second-matrix=$(jq -c '.second' <<< "${matrix}")" >> "${GITHUB_OUTPUT}"
          echo "has-second-batch=$(jq '.second.include | length > 0' <<< "${matrix}")" >> "${GITHUB_OUTPUT}"

  layered-tests:
    name: "${{ matrix.lane.name }} layer tests (batch 1)"
    needs: prepare-shards
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-shards.outputs.matrix) }}
    uses: ./.github/workflows/layered-test-shards.yml
    with:
      lane: ${{ toJson(matrix.lane) }}
      coordinate-matrix: ${{ toJson(matrix.coordinateMatrix) }}
      ref: ${{ needs.prepare-shards.outputs.revision }}
      java-version: ${{ inputs.java-version || 'latest-ea' }}
      native-image-mode: ${{ inputs.native-image-mode || 'current-defaults' }}

  second-batch:
    name: "${{ matrix.lane.name }} layer tests (batch 2)"
    needs: [prepare-shards, layered-tests]
    # Complete the sweep after test failures; stop on cancellation. §AR-layered-tests.
    if: ${{ !cancelled() && needs.prepare-shards.result == 'success' && needs.prepare-shards.outputs.has-second-batch == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-shards.outputs.second-matrix) }}
    uses: ./.github/workflows/layered-test-shards.yml
    with:
      lane: ${{ toJson(matrix.lane) }}
      coordinate-matrix: ${{ toJson(matrix.coordinateMatrix) }}
      ref: ${{ needs.prepare-shards.outputs.revision }}
      java-version: ${{ inputs.java-version || 'latest-ea' }}
      native-image-mode: ${{ inputs.native-image-mode || 'current-defaults' }}

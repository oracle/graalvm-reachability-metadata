# Per-PR gate: `grund check` over every namespace (§AR-grund-check, enforces
# §FS-repository-functional-spec.5.6), plus the check that the required-status-check ruleset
# still matches the gate job names (§AR-required-status-checks).
name: "Validate grund citations"

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  # Pinned, not floating: a newer grund can render a newer managed AGENTS.md block, which would
  # fail every PR until someone re-runs `grund init`. Bump this and the checksum together.
  GRUND_VERSION: "0.20.0"
  GRUND_SHA256: "2188f5d8c472a5e0a8db07982d60d2d8b18c8dfdf7e71a72125b407c14909d97"

jobs:
  grund-check:
    name: "🧭 Validate grund citations"
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: "🔎 Detect relevant file changes"
        id: filter
        uses: ./.github/actions/detect-file-changes
        with:
          # The union of every project's scanned roots (`[scan] include` and every scanned kind
          # folder) and their configs; a PR that touches none of them cannot break a citation.
          file-patterns: |
            - 'AGENTS.md'
            - 'README.md'
            - 'COVERAGE.md'
            - 'build.gradle'
            - 'grund.toml'
            - 'docs/**'
            - 'skills/**'
            - '.github/workflows/**'
            - '.github/actions/**'
            - '.ephor/**'
            - 'tests/tck-build-logic/**'
            - '.github/rulesets/**'
            - '.github/scripts/apply_required_checks_ruleset.py'
            - 'forge/AGENTS.md'
            - 'forge/README.md'
            - 'forge/DEVELOPING.md'
            - 'forge/grund.toml'
            - 'forge/docs/**'
            - 'forge/scripts/**'
            - 'forge/pylint_plugins/**'
            - 'forge/forge_metadata.py'
            - 'forge/run-forge.sh'
            - 'forge/dispatcher/**'
            - 'forge/.agent-grounds/rhei/**'
            - 'forge/prompt_templates/**'
            - 'forge/examples/**'
            - 'forge/ai_workflows/**'
            - 'forge/git_scripts/**'
            - 'forge/utility_scripts/**'
            - 'forge/benchmarks/**'
            - 'forge/tests/**'
            - 'real-use-tests/AGENTS.md'
            - 'real-use-tests/README.md'
            - 'real-use-tests/grund.toml'
            - 'real-use-tests/docs/**'
            - 'real-use-tests/.agent-grounds/rhei/**'

      - name: "🔧 Install grund"
        if: steps.filter.outputs.changed == 'true'
        run: |
          archive="grund-${GRUND_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/agent-grounds/grund/releases/download/v${GRUND_VERSION}/${archive}"
          echo "${GRUND_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/grund-${GRUND_VERSION}-x86_64-unknown-linux-gnu" >> "${GITHUB_PATH}"

      - name: "🧭 Check citations"
        if: steps.filter.outputs.changed == 'true'
        # Run from the workspace root: it is the only place the alias table that resolves
        # cross-namespace citations is in scope, so this one run covers Forge too.
        run: |
          grund check

      - name: "🔒 Check required status checks match gate jobs"
        if: steps.filter.outputs.changed == 'true'
        # A renamed gate job would silently orphan its required context; the ruleset is code,
        # so verify it here (§AR-required-status-checks).
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/apply_required_checks_ruleset.py --check
